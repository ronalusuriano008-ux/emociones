      const floorShaderMat = new THREE.ShaderMaterial({
        transparent: true,
        uniforms: {
          uTime: { value: 0 },
          uColor1: { value: new THREE.Color('#050005') },
          uColor2: { value: new THREE.Color('#ff2060') },
          uColor3: { value: new THREE.Color('#2000aa') }
        },
        vertexShader: `
      varying vec2 vUv;
      varying vec3 vPos;
      void main() {
        vUv = uv;
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      varying vec2 vUv;
      varying vec3 vPos;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      void main() {
        vec2 uv = vUv * 40.0;
        // Cuadrícula de calles
        float lineX = smoothstep(0.08, 0.0, abs(fract(uv.x) - 0.5));
        float lineY = smoothstep(0.08, 0.0, abs(fract(uv.y) - 0.5));
        float grid = max(lineX, lineY);
        
        // Distancia desde el centro para desvanecimiento
        float dist = length(vPos.xz) / 50.0;
        float fade = smoothstep(1.0, 0.2, dist);
        
        // Color pulsante en las intersecciones
        float intersection = lineX * lineY;
        vec3 color = mix(uColor1, uColor2, grid * 0.5);
        color += uColor3 * intersection * 2.0; // Cruces brillantes
        
        // Brillo que viaja por las calles
        float traveler = sin(uv.x * 3.14 + uTime * 2.0) * sin(uv.y * 3.14 - uTime * 1.5);
        color += uColor2 * smoothstep(0.9, 1.0, traveler) * grid * 0.5;

        float alpha = fade * (0.3 + grid * 0.7);
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), floorShaderMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -5;
      group.add(floor);
      updates.push((t) => { floorShaderMat.uniforms.uTime.value = t; });

      // Reflejo del suelo (plano extra semitransparente debajo)
      const reflectFloor = new THREE.Mesh(
        new THREE.PlaneGeometry(120, 120),
        new THREE.MeshStandardMaterial({ color: '#050005', roughness: 0.1, metalness: 1.0, transparent: true, opacity: 0.6 })
      );
      reflectFloor.rotation.x = -Math.PI / 2;
      reflectFloor.position.y = -5.1;
      group.add(reflectFloor);

      // ── CIELO DE MENSAJES DE KELY ──
      const skyMessages = [
        'Te elegí a ti', 'Siempre juntos', 'Mi destino', 'Eres mi hoy y mi mañana',
        'Nuestro amor', 'Para siempre', 'Mi lugar favorito', 'Gracias por existir'
      ];
      const skyGroup = new THREE.Group();
      skyMessages.forEach((msg, i) => {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 128;
        const ct = c.getContext('2d');
        ct.font = 'italic bold 48px Cormorant Garamond, serif';
        ct.textAlign = 'center';
        ct.textBaseline = 'middle';
        ct.shadowColor = '#ff4080';
        ct.shadowBlur = 20;
        ct.fillStyle = '#ff8090';
        ct.fillText(msg, 256, 64);

        const tex = new THREE.CanvasTexture(c);
        const skyMat = new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0.4,
          side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const skyPlane = new THREE.Mesh(new THREE.PlaneGeometry(25, 6), skyMat);
        const angle = (i / skyMessages.length) * Math.PI * 2;
        const radius = 40 + Math.random() * 20;
        skyPlane.position.set(
          Math.cos(angle) * radius,
          25 + Math.random() * 15,
          Math.sin(angle) * radius
        );
        skyPlane.lookAt(0, 30, 0); // Mirar hacia el centro
        skyPlane.userData = { baseOpacity: 0.3 + Math.random() * 0.2, phase: Math.random() * 6.28 };
        skyGroup.add(skyPlane);

        updates.push((t) => {
          skyPlane.material.opacity = skyPlane.userData.baseOpacity * (0.6 + 0.4 * Math.sin(t * 0.5 + skyPlane.userData.phase));
          skyPlane.position.y += Math.sin(t * 0.2 + skyPlane.userData.phase) * 0.002;
        });
      });
      group.add(skyGroup);

      // ── EDIFICIOS DE RECUERDOS (Torres de fotografías y cartas) ──
      const buildingSeeds = ['love', 'couple', 'sunset', 'romantic', 'heart', 'flower', 'ocean', 'stars', 'embrace', 'destiny', 'kiss', 'promise'];

      for (let i = 0; i < 18; i++) {
        const towerGroup = new THREE.Group();
        const floors = 3 + Math.floor(Math.random() * 5);
        const towerSeed = buildingSeeds[i % buildingSeeds.length];

        for (let f = 0; f < floors; f++) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = `https://picsum.photos/seed/${towerSeed}${i}floor${f}/256/256.jpg`;
          const tex = new THREE.Texture(img);
          img.onload = () => { tex.needsUpdate = true; };

          // Fotografía con marco
          const photoMat = new THREE.MeshStandardMaterial({
            map: tex, roughness: 0.5, metalness: 0.1,
            emissive: '#200810', emissiveIntensity: 0.4,
            side: THREE.DoubleSide
          });
          const photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), photoMat);
          photoMesh.position.y = f * 3;

          // Marco de la foto
          const frameMat = new THREE.MeshStandardMaterial({ color: '#000000', roughness: 0.3, metalness: 0.8 });
          const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.15, 0.15), frameMat);
          frameTop.position.set(0, 1.25, 0.08);
          photoMesh.add(frameTop);
          const frameBot = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.15, 0.15), frameMat);
          frameBot.position.set(0, -1.25, 0.08);
          photoMesh.add(frameBot);
          const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.15), frameMat);
          frameLeft.position.set(-1.25, 0, 0.08);
          photoMesh.add(frameLeft);
          const frameRight = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.15), frameMat);
          frameRight.position.set(1.25, 0, 0.08);
          photoMesh.add(frameRight);

          // Luz detrás de la foto (efecto ventana)
          const backLight = new THREE.PointLight('#ff4060', 0.5, 5);
          backLight.position.z = -0.5;
          photoMesh.add(backLight);

          // Hacerla interactiva
          photoMesh.userData = { isInteractive: true, id: `tower${i}floor${f}`, baseEmissive: 0.4, targetScale: 1 };
          interactivePhotos.push(photoMesh);
          towerGroup.add(photoMesh);

          // Cartas de amor como aleros
          if (f > 0 && Math.random() > 0.4) {
            const letterCanvas = document.createElement('canvas');
            letterCanvas.width = 256; letterCanvas.height = 128;
            const lCtx = letterCanvas.getContext('2d');
            lCtx.fillStyle = '#f5e6d3';
            lCtx.fillRect(0, 0, 256, 128);
            lCtx.font = '18px Cormorant Garamond, serif';
            lCtx.fillStyle = '#8a2030';
            lCtx.fillText('Mi amor...', 20, 40);
            lCtx.fillText('Siempre tuyo', 20, 70);
            const letterTex = new THREE.CanvasTexture(letterCanvas);

            const letterMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1.5, 0.8),
              new THREE.MeshStandardMaterial({ map: letterTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
            );
            letterMesh.position.set(1.5, f * 3 - 1, 0.5);
            letterMesh.rotation.y = -0.5;
            letterMesh.rotation.x = -0.2;
            towerGroup.add(letterMesh);
          }
        }

        const angle = (i / 18) * Math.PI * 2;
        const radius = 10 + Math.random() * 12;
        towerGroup.position.set(
          Math.cos(angle) * radius,
          -4,
          Math.sin(angle) * radius
        );
        towerGroup.rotation.y = angle + Math.PI;

        // Animación de construcción orgánica
        towerGroup.scale.y = 0;
        gsap.to(towerGroup.scale, { y: 1, duration: 2, delay: 1 + i * 0.15, ease: 'elastic.out(1, 0.5)' });

        group.add(towerGroup);
        updates.push((t) => {
          towerGroup.rotation.y += 0.001;
        });
      }

      // ── RAYCASTER E INTERACTIVIDAD (Cobra vida al mirarla) ──
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2(-10, -10); // Fuera de pantalla inicialmente

      const onPointerMove = (event) => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      };
      window.addEventListener('pointermove', onPointerMove);

      updates.push(() => {
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(interactivePhotos);

        // Resetear todas las fotos
        interactivePhotos.forEach(p => {
          p.userData.targetScale = 1.0;
          p.material.emissiveIntensity = THREE.MathUtils.lerp(p.material.emissiveIntensity, p.userData.baseEmissive, 0.1);
        });

        // Activar la foto mirada
        if (intersects.length > 0) {
          const obj = intersects[0].object;
          obj.userData.targetScale = 1.3;
          obj.material.emissiveIntensity = THREE.MathUtils.lerp(obj.material.emissiveIntensity, 2.5, 0.2);

          // Generar partículas de memoria si no está activa
          if (!obj.userData.memoryActive) {
            obj.userData.memoryActive = true;
            spawnMemoryParticles(obj.getWorldPosition(new THREE.Vector3()));
            setTimeout(() => { obj.userData.memoryActive = false; }, 1000);
          }
        }

        interactivePhotos.forEach(p => {
          p.scale.lerp(new THREE.Vector3(p.userData.targetScale, p.userData.targetScale, 1), 0.1);
        });
      });

      // ── PARTÍCULAS DE MEMORIA (Explosión holográfica al mirar foto) ──
      const memoryParticleMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: new THREE.Color('#ff80a0') },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vAlpha;
      attribute vec3 aVelocity;
      attribute float aLife;
      
      void main() {
        vec3 pos = position + aVelocity * uTime;
        float life = 1.0 - (uTime / aLife);
        vAlpha = life;
        
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = 4.0 * uPixelRatio * (50.0 / -mv.z) * life;
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `
      });

      function spawnMemoryParticles(origin) {
        const count = 50;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const velocities = new Float32Array(count * 3);
        const lifes = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          positions[i * 3] = origin.x;
          positions[i * 3 + 1] = origin.y;
          positions[i * 3 + 2] = origin.z;
          velocities[i * 3] = (Math.random() - 0.5) * 4;
          velocities[i * 3 + 1] = (Math.random() - 0.5) * 4;
          velocities[i * 3 + 2] = (Math.random() - 0.5) * 4;
          lifes[i] = 1.0 + Math.random() * 1.5;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aVelocity', new THREE.BufferAttribute(velocities, 3));
        geo.setAttribute('aLife', new THREE.BufferAttribute(lifes, 1));

        const mat = memoryParticleMat.clone();
        const points = new THREE.Points(geo, mat);
        points.startTime = clock.getElapsedTime();
        group.add(points);
        activeMemories.push(points);
      }

      updates.push((t) => {
        for (let i = activeMemories.length - 1; i >= 0; i--) {
          const m = activeMemories[i];
          const elapsed = t - m.startTime;
          m.material.uniforms.uTime.value = elapsed;
          if (elapsed > 2.5) {
            group.remove(m);
            m.geometry.dispose();
            m.material.dispose();
            activeMemories.splice(i, 1);
          }
        }
      });

      // ── LUCAS DE CALLE (Palabras románticas como neón) ──
      const neonWords = ['Amor', 'Siempre', 'Destino', 'Eterno', 'Unidos', 'Mi Vida', 'Sueño', 'Pasión', 'Magia', 'Felicidad'];
      neonWords.forEach((word, i) => {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 64;
        const ct = c.getContext('2d');
        ct.font = 'bold 40px Cormorant Garamond, serif';
        ct.textAlign = 'center';
        ct.textBaseline = 'middle';
        ct.shadowColor = '#ff2060';
        ct.shadowBlur = 25;
        ct.fillStyle = '#ff6090';
        ct.fillText(word, 128, 32);
        ct.shadowBlur = 0;
        ct.strokeStyle = '#ff2060';
        ct.lineWidth = 1;
        ct.strokeText(word, 128, 32);

        const tex = new THREE.CanvasTexture(c);
        const neonMat = new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0.9,
          side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const neon = new THREE.Mesh(new THREE.PlaneGeometry(4, 1), neonMat);

        const angle = (i / neonWords.length) * Math.PI * 2;
        const radius = 6 + Math.random() * 5;
        neon.position.set(
          Math.cos(angle) * radius,
          -3 + Math.random() * 2, // A la altura de la calle
          Math.sin(angle) * radius
        );
        neon.rotation.y = angle + Math.PI;
        neon.userData = { phase: Math.random() * 6.28 };

        group.add(neon);
        updates.push((t) => {
          neon.material.opacity = 0.6 + 0.4 * Math.sin(t * 2.5 + neon.userData.phase); // Parpadeo neón
        });
      });

      // ── PARTÍCULAS AMBIENTALES (Ascendentes) ──
      const emberParticles = createParticles(4000, { spread: 50, size: 0.15, color: '#ff4060', opacity: 0.6 });
      group.add(emberParticles);
      // Sobrescribir el update de las partículas para que subvan como brasas
      const posArray = emberParticles.geometry.attributes.position.array;
      const origYEmber = new Float32Array(posArray.length / 3);
      for (let i = 0; i < origYEmber.length; i++) origYEmber[i] = posArray[i * 3 + 1];

      updates.push((t) => {
        emberParticles.material.uniforms.uTime.value = t;
        for (let i = 0; i < origYEmber.length; i++) {
          posArray[i * 3 + 1] = ((origYEmber[i] + t * (0.5 + emberParticles.geometry.attributes.aRandom.array[i] * 0.5)) % 30) - 5;
        }
        emberParticles.geometry.attributes.position.needsUpdate = true;
      });

      // ── RAYOS VOLUMÉTRICOS DEL ATARDECER ──
      const godRayMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color('#ff4030') } },
        vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      varying vec2 vUv;
      void main() {
        float fade = smoothstep(0.0, 0.4, vUv.y) * smoothstep(1.0, 0.6, vUv.y);
        float flicker = 0.8 + 0.2 * sin(uTime * 0.5 + vUv.y * 2.0);
        float alpha = fade * 0.03 * flicker;
        gl_FragColor = vec4(uColor, alpha);
      }
    `
      });
      for (let i = 0; i < 8; i++) {
        const ray = new THREE.Mesh(new THREE.PlaneGeometry(3, 50), godRayMat.clone());
        ray.position.set(-30 + i * 8, 15, -20);
        ray.rotation.x = -0.2;
        ray.rotation.z = -0.1 + i * 0.05;
        group.add(ray);
        updates.push((t) => { ray.material.uniforms.uTime.value = t; });
      }

      // ── CÁMARA CINEMATOGRÁFICA ──
      const camTarget = { radius: 18, height: 4, speed: 0.1 };
      gsap.to(camTarget, { radius: 12, duration: 15, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to(camTarget, { height: 8, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 });

      return {
        group, updates,
        cameraUpdate: () => {
          const t = clock.getElapsedTime();
          camera.position.set(
            Math.sin(t * camTarget.speed) * camTarget.radius + mouseX * 3,
            camTarget.height + mouseY * 2,
            Math.cos(t * camTarget.speed) * camTarget.radius
          );
          camera.lookAt(0, 2, 0);
        },
        destroy: () => {
          window.removeEventListener('pointermove', onPointerMove);
          scene.fog = new THREE.FogExp2('#000000', 0.008);
          group.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
      };
    }
    // ═══════════════════════════════════════════
    // ESCENA 4: EL JARDÍN DEL TIEMPO
    // ═══════════════════════════════════════════
    function createScene4() {
      const group = new THREE.Group();
      const updates = [];

      // ── ATMÓSFERA VIOLET EVERGARDEN ──
      scene.fog = new THREE.FogExp2('#1a0a20', 0.015);

      // ── ILUMINACIÓN ONÍRICA ──
      const ambient = new THREE.AmbientLight('#2a1a3a', 0.6);
      group.add(ambient);

      const sunLight = new THREE.DirectionalLight('#ffccaa', 1.2);
      sunLight.position.set(10, 25, 15);
      group.add(sunLight);

      const moonLight = new THREE.DirectionalLight('#8080ff', 0.4);
      moonLight.position.set(-15, 10, -10);
      group.add(moonLight);

      const gardenGlow = new THREE.PointLight('#ff40a0', 2, 40);
      gardenGlow.position.set(0, 3, 0);
      group.add(gardenGlow);

      // ── SUELO DE MUSGO LUMINISCENTE ──
      const groundMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor1: { value: new THREE.Color('#050a05') },
          uColor2: { value: new THREE.Color('#1a6a2a') }
        },
        vertexShader: `
      varying vec2 vUv;
      varying vec3 vPos;
      void main() {
        vUv = uv;
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      varying vec2 vUv;
      varying vec3 vPos;
      
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      
      void main() {
        vec2 uv = vUv * 30.0;
        float n = hash(floor(uv));
        float dist = length(vPos.xz) / 50.0;
        float fade = smoothstep(1.0, 0.2, dist);
        vec3 color = mix(uColor1, uColor2, n * 0.3);
        // Puntos de luz en el césped
        float dots = smoothstep(0.4, 0.5, n) * smoothstep(0.6, 0.5, n);
        color += vec3(0.2, 0.8, 0.4) * dots * 2.0 * (0.5 + 0.5 * sin(uTime * 2.0 + n * 6.28));
        gl_FragColor = vec4(color, fade);
      }
    `
      });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -3;
      group.add(ground);
      updates.push((t) => { groundMat.uniforms.uTime.value = t; });

      // ── RAYOS DE SOL VOLUMÉTRICOS ──
      for (let i = 0; i < 6; i++) {
        const rayGeo = new THREE.PlaneGeometry(4, 40);
        const rayMat = new THREE.MeshBasicMaterial({
          color: '#ffddc0', transparent: true, opacity: 0.03,
          side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const ray = new THREE.Mesh(rayGeo, rayMat);
        ray.position.set((Math.random() - 0.5) * 20, 15, (Math.random() - 0.5) * 20);
        ray.rotation.x = -0.3;
        ray.rotation.z = (Math.random() - 0.5) * 0.4;
        group.add(ray);
        updates.push((t) => {
          rayMat.opacity = 0.02 + 0.015 * Math.sin(t * 0.3 + i * 1.5);
          ray.rotation.y = t * 0.02 + i;
        });
      }

      // ── ÁRBOLES CRISTALINOS MEJORADOS ──
      for (let i = 0; i < 10; i++) {
        const treeGroup = new THREE.Group();

        // Tronco facetado
        const trunkGeo = new THREE.CylinderGeometry(0.15, 0.4, 5 + Math.random() * 3, 6);
        const trunkMat = new THREE.MeshPhysicalMaterial({
          color: '#1a1a4a', roughness: 0.1, metalness: 0.2,
          transmission: 0.6, thickness: 1.5, transparent: true, opacity: 0.8
        });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 0;
        treeGroup.add(trunk);

        // Copa cristalina doble capa
        const crownGeo = new THREE.IcosahedronGeometry(2.5 + Math.random(), 1);
        const crownMatSolid = new THREE.MeshPhysicalMaterial({
          color: '#3050dd', roughness: 0.1, metalness: 0.1,
          transmission: 0.8, thickness: 2, transparent: true, opacity: 0.3
        });
        const crownSolid = new THREE.Mesh(crownGeo, crownMatSolid);
        crownSolid.position.y = 4;
        treeGroup.add(crownSolid);

        const crownWire = new THREE.Mesh(crownGeo, new THREE.MeshBasicMaterial({
          color: '#6080ff', wireframe: true, transparent: true, opacity: 0.4
        }));
        crownWire.position.y = 4;
        crownWire.scale.set(1.02, 1.02, 1.02);
        treeGroup.add(crownWire);

        // Hojas con recuerdos flotando
        for (let j = 0; j < 8; j++) {
          const leafCanvas = document.createElement('canvas');
          leafCanvas.width = 128; leafCanvas.height = 64;
          const lCtx = leafCanvas.getContext('2d');
          lCtx.font = 'italic 20px Cormorant Garamond, serif';
          lCtx.fillStyle = '#ffd700';
          lCtx.textAlign = 'center';
          const phrases = ['Recuerdo', 'Nuestro', 'Siempre', 'Amor', 'Vida', 'Juntos', 'Sueño', 'Ternura'];
          lCtx.fillText(phrases[j % phrases.length], 64, 35);

          const leafTex = new THREE.CanvasTexture(leafCanvas);
          const leaf = new THREE.Mesh(
            new THREE.PlaneGeometry(0.8, 0.4),
            new THREE.MeshBasicMaterial({ map: leafTex, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
          );
          const lAngle = (j / 8) * Math.PI * 2;
          const lR = 2 + Math.random() * 1.5;
          leaf.position.set(Math.cos(lAngle) * lR, 3.5 + Math.random() * 2, Math.sin(lAngle) * lR);
          leaf.lookAt(0, leaf.position.y, 0);
          leaf.userData = { origY: leaf.position.y, phase: Math.random() * 6.28, speed: 0.5 + Math.random() * 0.5 };
          treeGroup.add(leaf);

          updates.push((t) => {
            leaf.position.y = leaf.userData.origY + Math.sin(t * leaf.userData.speed + leaf.userData.phase) * 0.3;
            leaf.rotation.y += 0.01;
            leaf.material.opacity = 0.5 + 0.3 * Math.sin(t * 1.5 + leaf.userData.phase);
          });
        }

        const angle = (i / 10) * Math.PI * 2;
        const r = 10 + Math.random() * 12;
        treeGroup.position.set(Math.cos(angle) * r, -3, Math.sin(angle) * r);
        treeGroup.rotation.y = Math.random() * Math.PI;
        group.add(treeGroup);

        updates.push((t) => {
          treeGroup.rotation.z = Math.sin(t * 0.2 + i) * 0.03; // Viento
        });
      }

      // ── FLORES GIGANTES ESTILIZADAS (Curvas Bézier) ──
      const flowerColors = ['#ff4080', '#ff80c0', '#e040a0', '#ff60d0', '#ff3090', '#cc40ff'];
      const flowerGroups = [];

      for (let i = 0; i < 8; i++) {
        const flowerGroup = new THREE.Group();

        // Tallo curvado
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(Math.random() - 0.5, 1.5, Math.random() - 0.5),
          new THREE.Vector3(Math.random() - 0.5, 3, Math.random() - 0.5),
          new THREE.Vector3(0, 4.5, 0)
        ]);
        const stemGeo = new THREE.TubeGeometry(curve, 20, 0.06, 8, false);
        const stemMat = new THREE.MeshStandardMaterial({ color: '#1a5a1a', roughness: 0.8, metalness: 0.1 });
        flowerGroup.add(new THREE.Mesh(stemGeo, stemMat));

        // Pétalos estilizados con Shape
        const color = flowerColors[i % flowerColors.length];
        const petalCount = 5 + Math.floor(Math.random() * 3);

        for (let p = 0; p < petalCount; p++) {
          const shape = new THREE.Shape();
          shape.moveTo(0, 0);
          shape.bezierCurveTo(0.4, 0.8, 0.4, 1.8, 0, 2.5);
          shape.bezierCurveTo(-0.4, 1.8, -0.4, 0.8, 0, 0);

          const petalGeo = new THREE.ShapeGeometry(shape);
          const petalMat = new THREE.MeshPhysicalMaterial({
            color, roughness: 0.3, metalness: 0.1,
            transparent: true, opacity: 0.85, side: THREE.DoubleSide,
            emissive: color, emissiveIntensity: 0.3
          });
          const petal = new THREE.Mesh(petalGeo, petalMat);

          const pAngle = (p / petalCount) * Math.PI * 2;
          petal.rotation.x = -Math.PI / 2 + 0.4; // Inclinar hacia afuera
          petal.rotation.z = pAngle;
          petal.position.y = 4.5;
          petal.userData = { baseRotX: petal.rotation.x, phase: Math.random() * 6.28 };

          flowerGroup.add(petal);
        }

        // Centro luminoso
        const centerGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const centerMat = new THREE.MeshStandardMaterial({
          color: '#ffdd00', emissive: '#ffaa00', emissiveIntensity: 1.5
        });
        const center = new THREE.Mesh(centerGeo, centerMat);
        center.position.y = 4.5;
        flowerGroup.add(center);

        // Punto de luz interior
        const fLight = new THREE.PointLight(color, 1, 8);
        fLight.position.y = 4.5;
        flowerGroup.add(fLight);

        const fAngle = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
        const fR = 4 + Math.random() * 6;
        flowerGroup.position.set(Math.cos(fAngle) * fR, -3, Math.sin(fAngle) * fR);
        flowerGroup.userData = { phase: Math.random() * 6.28, speed: 0.4 + Math.random() * 0.3, baseScale: 0.8 + Math.random() * 0.5 };
        flowerGroup.scale.set(0, 0, 0); // Crece animadamente
        gsap.to(flowerGroup.scale, { x: flowerGroup.userData.baseScale, y: flowerGroup.userData.baseScale, z: flowerGroup.userData.baseScale, duration: 2, delay: 1 + i * 0.2, ease: 'elastic.out(1, 0.6)' });

        group.add(flowerGroup);
        flowerGroups.push(flowerGroup);

        updates.push((t) => {
          flowerGroup.rotation.y = Math.sin(t * 0.3 + flowerGroup.userData.phase) * 0.15;
          // Reacción musical simulada (respiración rítmica)
          const breathe = 1 + Math.sin(t * 2.0 + flowerGroup.userData.phase) * 0.05;
          flowerGroup.scale.set(
            flowerGroup.userData.baseScale * breathe,
            flowerGroup.userData.baseScale * breathe,
            flowerGroup.userData.baseScale * breathe
          );
          // Mover pétalos suavemente
          flowerGroup.children.forEach(child => {
            if (child.userData.baseRotX !== undefined) {
              child.rotation.x = child.userData.baseRotX + Math.sin(t * 0.8 + child.userData.phase) * 0.1;
            }
          });
        });
      }

      // ── LLUVIA DE PÉTALOS CON FRASES ──
      const petalPhrases = ['Amor', 'Vida', 'Siempre', 'Sueño', 'Tú y Yo', 'Magia', 'Eterno', 'Paz'];
      const fallingPetals = [];

      for (let i = 0; i < 50; i++) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 128; pCanvas.height = 64;
        const pCtx = pCanvas.getContext('2d');

        // Forma de pétalo rosado
        pCtx.fillStyle = '#ff80b0';
        pCtx.beginPath();
        pCtx.ellipse(64, 32, 50, 25, 0, 0, Math.PI * 2);
        pCtx.fill();

        // Texto de amor
        pCtx.font = 'italic bold 22px Cormorant Garamond, serif';
        pCtx.fillStyle = '#ffffff';
        pCtx.textAlign = 'center';
        pCtx.textBaseline = 'middle';
        pCtx.fillText(petalPhrases[i % petalPhrases.length], 64, 32);

        const pTex = new THREE.CanvasTexture(pCanvas);
        const petal = new THREE.Mesh(
          new THREE.PlaneGeometry(0.6, 0.3),
          new THREE.MeshBasicMaterial({ map: pTex, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false })
        );

        petal.position.set(
          (Math.random() - 0.5) * 30,
          Math.random() * 15 + 5,
          (Math.random() - 0.5) * 30
        );
        petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        petal.userData = {
          velY: -0.01 - Math.random() * 0.02,
          rotSpeed: (Math.random() - 0.5) * 0.05,
          windPhase: Math.random() * 6.28,
          windSpeed: 0.5 + Math.random() * 1.0,
          windAmp: 0.02 + Math.random() * 0.03
        };

        group.add(petal);
        fallingPetals.push(petal);
      }

      updates.push((t) => {
        fallingPetals.forEach(p => {
          p.position.y += p.userData.velY;
          p.position.x += Math.sin(t * p.userData.windSpeed + p.userData.windPhase) * p.userData.windAmp;
          p.position.z += Math.cos(t * p.userData.windSpeed * 0.7 + p.userData.windPhase) * p.userData.windAmp * 0.5;
          p.rotation.x += p.userData.rotSpeed;
          p.rotation.z += p.userData.rotSpeed * 0.5;

          if (p.position.y < -3) {
            p.position.y = 15 + Math.random() * 5;
            p.position.x = (Math.random() - 0.5) * 30;
            p.position.z = (Math.random() - 0.5) * 30;
          }
        });
      });

      // ── PARTÍCULAS DE POLVO MÁGICO ──
      const magicDust = createParticles(3000, { spread: 40, size: 0.12, color: '#ffaaee', opacity: 0.5 });
      group.add(magicDust);
      updates.push((t) => { magicDust.material.uniforms.uTime.value = t; });

      // ── MARIPOSAS DE LUZ CON ALAS GEOMÉTRICAS ──
      for (let i = 0; i < 15; i++) {
        const butterflyGroup = new THREE.Group();

        const wingGeo = new THREE.CircleGeometry(0.2, 4); // Alas diamante
        const wingMat = new THREE.MeshBasicMaterial({
          color: '#ffaaff', transparent: true, opacity: 0.8,
          side: THREE.DoubleSide, blending: THREE.AdditiveBlending
        });

        const leftWing = new THREE.Mesh(wingGeo, wingMat.clone());
        leftWing.position.x = -0.15;
        butterflyGroup.add(leftWing);

        const rightWing = new THREE.Mesh(wingGeo, wingMat.clone());
        rightWing.position.x = 0.15;
        butterflyGroup.add(rightWing);

        // Trail de luz
        const bLight = new THREE.PointLight('#ff80ff', 0.3, 3);
        butterflyGroup.add(bLight);

        butterflyGroup.userData = {
          radius: 4 + Math.random() * 12,
          speed: 0.2 + Math.random() * 0.4,
          yBase: 2 + Math.random() * 6,
          phase: Math.random() * 6.28,
          yOffset: 1 + Math.random() * 2,
          flapSpeed: 8 + Math.random() * 6
        };

        group.add(butterflyGroup);
        updates.push((t) => {
          const d = butterflyGroup.userData;
          const a = t * d.speed + d.phase;
          butterflyGroup.position.set(
            Math.cos(a) * d.radius,
            d.yBase + Math.sin(t * 0.8 + d.phase) * d.yOffset,
            Math.sin(a) * d.radius
          );
          butterflyGroup.rotation.y = a + Math.PI / 2;
          // Aleteo
          const flap = Math.sin(t * d.flapSpeed + d.phase) * 0.8;
          leftWing.rotation.y = flap;
          rightWing.rotation.y = -flap;
          leftWing.material.opacity = 0.5 + Math.abs(flap) * 0.5;
          rightWing.material.opacity = 0.5 + Math.abs(flap) * 0.5;
        });
      }

      // ── CÁMARA DE ENSUEÑO ──
      const camBase = { radius: 15, height: 3, speed: 0.06 };
      gsap.to(camBase, { radius: 10, duration: 12, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to(camBase, { height: 6, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 });

      return {
        group, updates,
        cameraUpdate: () => {
          const t = clock.getElapsedTime();
          camera.position.set(
            Math.sin(t * camBase.speed) * camBase.radius + mouseX * 2,
            camBase.height + mouseY * 1.5,
            Math.cos(t * camBase.speed) * camBase.radius
          );
          camera.lookAt(0, 2, 0);
        },
        destroy: () => {
          scene.fog = new THREE.FogExp2('#000000', 0.008);
          group.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
      };
    }
    // ═══════════════════════════════════════════
    // ESCENA 5: LAS CARTAS DE KELY
    // ═══════════════════════════════════════════
    function createScene5() {
      const group = new THREE.Group();
      const updates = [];
      let teAmoTriggered = false;
      let activeWritingInterval = null;

      // ── ATMÓSFERA DE TORMENTA DE PAPEL ──
      scene.fog = new THREE.FogExp2('#0a0508', 0.02);

      // ── ILUMINACIÓN DRAMÁTICA ──
      const ambient = new THREE.AmbientLight('#1a0808', 0.4);
      group.add(ambient);

      const keyLight = new THREE.SpotLight('#ff2040', 4, 80, Math.PI / 5, 0.5, 1);
      keyLight.position.set(0, 20, 20);
      keyLight.target.position.set(0, 0, 0);
      group.add(keyLight);
      group.add(keyLight.target);

      const rimLight = new THREE.PointLight('#4a00ff', 2, 60);
      rimLight.position.set(-20, 5, -10);
      group.add(rimLight);

      const warmFill = new THREE.PointLight('#ffd700', 1.5, 50);
      warmFill.position.set(10, 5, 10);
      group.add(warmFill);

      // ── VÓRTICE DE CARTAS (Tormenta infinita) ──
      const letters = [
        'Cada momento a tu lado es un regalo que guardo en el corazon',
        'Eres la razon por la que creo en el destino',
        'Tu sonrisa es mi lugar favorito en el mundo',
        'No hay distancia que pueda separar lo que siento por ti',
        'Eres mi hoy, mi manana y mi siempre',
        'Contigo descubri que el amor verdadero existe',
        'Cada dia a tu lado es la mejor aventura de mi vida',
        'TE AMO' // La carta definitiva
      ];

      const envelopeGroups = [];
      const totalEnvelopes = 80;

      for (let i = 0; i < totalEnvelopes; i++) {
        const envGroup = new THREE.Group();
        const isSpecialLetter = i < letters.length;
        const isTeAmo = letters[i] === 'TE AMO';

        // Sobre principal
        const envelopeMat = new THREE.MeshStandardMaterial({
          color: isTeAmo ? '#ff0040' : (isSpecialLetter ? '#8b1a1a' : '#4a1010'),
          roughness: 0.6, metalness: 0.2,
          emissive: isTeAmo ? '#ff0040' : '#200505', emissiveIntensity: isTeAmo ? 0.8 : 0.2
        });
        const envelope = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.06), envelopeMat);
        envGroup.add(envelope);

        // Solapa del sobre (para animación de apertura)
        const flapMat = new THREE.MeshStandardMaterial({ color: envelopeMat.color, roughness: 0.6, metalness: 0.2, side: THREE.DoubleSide });
        const flap = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.5), flapMat);
        flap.position.y = 0.5;
        flap.position.z = 0.03;
        flap.rotation.x = Math.PI; // Cerrada
        flap.userData.isFlap = true;
        envGroup.add(flap);

        // Papel interior asomando
        const paperMat = new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.9, side: THREE.DoubleSide });
        const paper = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.8), paperMat);
        paper.position.z = 0.04;
        paper.rotation.y = Math.PI; // Oculto inicialmente
        envGroup.add(paper);

        // Sello de cera
        if (isSpecialLetter) {
          const sealGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.04, 16);
          const sealMat = new THREE.MeshStandardMaterial({
            color: isTeAmo ? '#ffdd00' : '#ffd700',
            emissive: isTeAmo ? '#ffaa00' : '#aa8800',
            emissiveIntensity: isTeAmo ? 1.5 : 0.5,
            roughness: 0.3, metalness: 0.8
          });
          const seal = new THREE.Mesh(sealGeo, sealMat);
          seal.rotation.x = Math.PI / 2;
          seal.position.set(0.4, 0.2, 0.04);
          envGroup.add(seal);

          // Luz interior para las cartas importantes
          if (isTeAmo) {
            const lLight = new THREE.PointLight('#ff0040', 2, 5);
            lLight.position.set(0, 0, 1);
            envGroup.add(lLight);
          }
        }

        // Posicionamiento en vórtice doble hélice
        const t_param = i / totalEnvelopes;
        const angle = t_param * Math.PI * 12; // 6 vueltas
        const radius = 6 + t_param * 15;
        const height = (t_param - 0.5) * 30;

        envGroup.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius
        );

        // Orientar hacia el centro con algo de randomidad
        envGroup.lookAt(0, envGroup.position.y, 0);
        envGroup.rotation.z += (Math.random() - 0.5) * 0.5;

        envGroup.userData = {
          isLetter: isSpecialLetter,
          isTeAmo: isTeAmo,
          letterIndex: i,
          origPos: envGroup.position.clone(),
          origRot: envGroup.rotation.clone(),
          phase: Math.random() * 6.28,
          speed: 0.3 + Math.random() * 0.5,
          floatAmp: 0.5 + Math.random() * 1.0,
          isAnimating: false
        };

        group.add(envGroup);
        envelopeGroups.push(envGroup);
      }

      // ── PARTÍCULAS DE TINTA Y POLVO DORADO ──
      const inkParticles = createParticles(3000, { spread: 50, size: 0.12, color: '#1a0030', opacity: 0.6 });
      group.add(inkParticles);
      updates.push((t) => { inkParticles.material.uniforms.uTime.value = t; });

      const goldParticles = createParticles(4000, { spread: 50, size: 0.15, color: '#ffd700', opacity: 0.4 });
      group.add(goldParticles);
      updates.push((t) => { goldParticles.material.uniforms.uTime.value = t; });

      // ── RAYCASTER E INTERACCIÓN CINEMATOGRÁFICA ──
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2(-10, -10);
      let hoveredEnvelope = null;

      const onPointerMove = (event) => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      };

      const onClick = (e) => {
        if (!hoveredEnvelope || hoveredEnvelope.userData.isAnimating) return;

        const clickedGroup = hoveredEnvelope;
        const idx = clickedGroup.userData.letterIndex;

        if (idx >= letters.length) return; // Solo las especiales se abren

        const letterText = letters[idx];
        clickedGroup.userData.isAnimating = true;

        // 1. Traer la carta hacia la cámara
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        const targetPos = camera.position.clone().add(camDir.multiplyScalar(3));

        gsap.to(clickedGroup.position, {
          x: targetPos.x, y: targetPos.y, z: targetPos.z,
          duration: 1, ease: 'power2.out'
        });
        gsap.to(clickedGroup.rotation, {
          x: 0, y: 0, z: 0,
          duration: 1, ease: 'power2.out',
          onComplete: () => {
            // 2. Abrir la solapa
            const flap = clickedGroup.children.find(c => c.userData.isFlap);
            if (flap) {
              gsap.to(flap.rotation, { x: -Math.PI / 2, duration: 0.8, ease: 'back.out(1.7)' });
            }
            // 3. Mostrar papel
            const paper = clickedGroup.children.find(c => c.material && c.material.color && c.material.color.getHexString() === 'f5e6d3');
            if (paper) {
              gsap.to(paper.rotation, { y: 0, duration: 0.5, delay: 0.3 });
              gsap.to(paper.position, { z: 0.2, duration: 0.5, delay: 0.3 });
            }

            // 4. Mostrar UI con efecto de escritura
            showLetterUI(letterText, clickedGroup);
          }
        });
      };

      function showLetterUI(text, envelopeGroup) {
        const overlay = document.getElementById('letter-overlay');
        const content = document.getElementById('letter-content');
        content.innerHTML = ''; // Limpiar
        overlay.classList.add('active');

        // Efecto de escritura con partículas
        let charIdx = 0;
        clearInterval(activeWritingInterval);

        activeWritingInterval = setInterval(() => {
          if (charIdx < text.length) {
            const span = document.createElement('span');
            span.textContent = text[charIdx];
            span.style.opacity = '0';
            span.style.transition = 'opacity 0.3s, text-shadow 0.5s';
            content.appendChild(span);

            // Animar entrada del carácter
            setTimeout(() => {
              span.style.opacity = '1';
              span.style.textShadow = '0 0 15px #ffd700';
            }, 50);

            // Generar partícula de tinta en 3D
            spawnInkParticle(envelopeGroup.position.clone());

            if (charIdx % 3 === 0) audio.playChime(600 + Math.random() * 400);
            charIdx++;
          } else {
            clearInterval(activeWritingInterval);
            // Comprobar si es TE AMO
            if (text === 'TE AMO' && !teAmoTriggered) {
              teAmoTriggered = true;
              setTimeout(() => triggerTeAmo(envelopeGroup), 1000);
            } else {
              // Devolver la carta a su lugar
              setTimeout(() => returnEnvelope(envelopeGroup), 2000);
            }
          }
        }, 60);
      }

      function returnEnvelope(env) {
        gsap.to(env.position, {
          x: env.userData.origPos.x, y: env.userData.origPos.y, z: env.userData.origPos.z,
          duration: 1.5, ease: 'power2.inOut'
        });
        gsap.to(env.rotation, {
          x: env.userData.origRot.x, y: env.userData.origRot.y, z: env.userData.origRot.z,
          duration: 1.5, ease: 'power2.inOut',
          onComplete: () => { env.userData.isAnimating = false; }
        });
        document.getElementById('letter-overlay').classList.remove('active');
      }

      // ── PARTÍCULAS DE TINTA mÁGICA ──
      const inkSparks = [];
      function spawnInkParticle(origin) {
        const sparkGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const sparkMat = new THREE.MeshBasicMaterial({
          color: '#ffd700', transparent: true, opacity: 1, blending: THREE.AdditiveBlending
        });
        const spark = new THREE.Mesh(sparkGeo, sparkMat);
        spark.position.copy(origin);
        spark.userData.vel = new THREE.Vector3((Math.random() - 0.5) * 0.1, Math.random() * 0.1, (Math.random() - 0.5) * 0.1);
        group.add(spark);
        inkSparks.push(spark);
      }

      updates.push(() => {
        for (let i = inkSparks.length - 1; i >= 0; i--) {
          const s = inkSparks[i];
          s.position.add(s.userData.vel);
          s.userData.vel.y -= 0.001; // Gravedad
          s.material.opacity -= 0.02;
          if (s.material.opacity <= 0) {
            group.remove(s);
            s.geometry.dispose();
            s.material.dispose();
            inkSparks.splice(i, 1);
          }
        }
      });

      // ── HOVER EFFECT ──
      updates.push(() => {
        raycaster.setFromCamera(pointer, camera);
        const envelopes = envelopeGroups.filter(g => g.userData.isLetter && !g.userData.isAnimating).map(g => g.children[0]);
        const intersects = raycaster.intersectObjects(envelopes);

        if (hoveredEnvelope && hoveredEnvelope !== (intersects.length > 0 ? intersects[0].object.parent : null)) {
          gsap.to(hoveredEnvelope.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
          hoveredEnvelope = null;
        }

        if (intersects.length > 0) {
          hoveredEnvelope = intersects[0].object.parent;
          gsap.to(hoveredEnvelope.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.3 });
          document.body.style.cursor = 'pointer';
        } else {
          document.body.style.cursor = 'default';
        }
      });

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('click', onClick);

      // ── EVENTO ÉPICO: "TE AMO" - EL UNIVERSO RESPONDE ──
      function triggerTeAmo(originEnvelope) {
        document.getElementById('letter-overlay').classList.remove('active');
        document.body.style.cursor = 'default';

        // 1. Screen Shake
        const origCamPos = camera.position.clone();
        gsap.to(camera.position, {
          x: origCamPos.x + (Math.random() - 0.5) * 2,
          y: origCamPos.y + (Math.random() - 0.5) * 2,
          duration: 0.1, repeat: 10, yoyo: true,
          ease: 'none',
          onComplete: () => camera.position.copy(origCamPos)
        });

        // 2. Onda de choque expansiva
        const shockwaveGeo = new THREE.RingGeometry(0.1, 1, 64);
        const shockwaveMat = new THREE.MeshBasicMaterial({
          color: '#ff0055', transparent: true, opacity: 1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
        });
        const shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.position.copy(originEnvelope.position);
        shockwave.lookAt(camera.position);
        group.add(shockwave);

        gsap.to(shockwave.scale, { x: 60, y: 60, z: 60, duration: 2, ease: 'power2.out' });
        gsap.to(shockwaveMat, { opacity: 0, duration: 2 });

        // 3. Flash de luz masivo
        const flash = new THREE.PointLight('#ffffff', 50, 200);

          for (let i = 0; i < this.count; i++) {
            arr[i * 3] += this.vel[i].x;
            arr[i * 3 + 1] += this.vel[i].y - 0.003; // Gravedad
            arr[i * 3 + 2] += this.vel[i].z;
            // Rozamiento
            this.vel[i].x *= 0.985;
            this.vel[i].y *= 0.985;
            this.vel[i].z *= 0.985;
          }
          this.geo.attributes.position.needsUpdate = true;
          this.mat.opacity = this.life;
          this.mat.size = 0.5 * this.life; // Se encogen al morir

          this.light.intensity = this.life * 5;

          return true;
        }

        dispose() {
          group.remove(this.mesh);
          group.remove(this.light);
          this.geo.dispose();
          this.mat.dispose();
          const idx = dynamicObjects.indexOf(this);
          if (idx > -1) dynamicObjects.splice(idx, 1);
        }
      }

      // Lanzar fuegos artificiales periódicamente
      const fireworkInterval = setInterval(() => {
        new CosmicFirework();
        audio.playChime(300 + Math.random() * 600);
      }, 1000);

      updates.push(() => {
        for (let i = dynamicObjects.length - 1; i >= 0; i--) {
          dynamicObjects[i].update();
        }
      });

      // ── CÁMARA CINEMATOGRÁFICA ──
      const camBase = { x: 0, y: 5, z: 45, lookY: 0 };
      // Dolly in
      gsap.to(camBase, { z: 28, duration: 15, ease: 'power1.out' });
      // Crane up/down
      gsap.to(camBase, { y: 12, duration: 12, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to(camBase, { lookY: 2, duration: 12, ease: 'sine.inOut', yoyo: true, repeat: -1 });

      return {
        group, updates,
        cameraUpdate: () => {
          const t = clock.getElapsedTime();
          camera.position.set(
            camBase.x + Math.sin(t * 0.1) * 6 + mouseX * 4,
            camBase.y + mouseY * 3,
            camBase.z + Math.cos(t * 0.1) * 6
          );
          camera.lookAt(0, camBase.lookY, -20);
        },
        destroy: () => {
          clearInterval(fireworkInterval);
          dynamicObjects.forEach(obj => {
            group.remove(obj.mesh);
            group.remove(obj.light);
            obj.geo.dispose();
            obj.mat.dispose();
          });
          dynamicObjects.length = 0;

          scene.fog = new THREE.FogExp2('#000000', 0.008); // Restaurar niebla por defecto
          group.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
      };
    }
    // ═══════════════════════════════════════════

    function createScene7() {
      const group = new THREE.Group();
      const updates = [];

      // ── ATMÓSFERA FINAL (Espacio profundo romántico) ──
      scene.fog = new THREE.FogExp2('#05010a', 0.008);

      const backLight = new THREE.PointLight('#6020ff', 2, 80);
      backLight.position.set(0, 10, -20);
      group.add(backLight);

      const warmFill = new THREE.PointLight('#ffd700', 1.5, 60);
      warmFill.position.set(10, -5, 10);
      group.add(warmFill);

      // ── FONDO CÓSMICO (Nebulosa profunda) ──
      const nebulaGeo = new THREE.PlaneGeometry(300, 300);
      const nebulaMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
      }
      void main() {
        vec2 uv = vUv - 0.5;
        float dist = length(uv);
        float n = noise(uv * 3.0 + uTime * 0.02);
        float n2 = noise(uv * 5.0 - uTime * 0.03);
        vec3 color = mix(vec3(0.1, 0.0, 0.2), vec3(0.3, 0.0, 0.1), n);
        color += vec3(0.1, 0.05, 0.2) * n2;
        float alpha = smoothstep(0.5, 0.0, dist) * n * 0.4;
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
      nebula.position.z = -60;
      group.add(nebula);
      updates.push((t) => { nebulaMat.uniforms.uTime.value = t; });

      const bgStars = createParticles(25000, { spread: 250, size: 0.2, color: '#ffffff', opacity: 0.7 });
      group.add(bgStars);
      updates.push((t) => { bgStars.material.uniforms.uTime.value = t; });

      // ── ESTRUCTURA DEL CORAZÓN (Subgrupo para latido sincronizado) ──
      const heartGroup = new THREE.Group();
      group.add(heartGroup);

      // 1. Núcleo luminoso del corazón
      const coreGeo = new THREE.IcosahedronGeometry(4, 4);
      const coreMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: 0 },
          uColor1: { value: new THREE.Color('#ff1050') },
          uColor2: { value: new THREE.Color('#ff80aa') }
        },
        vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);
        vec3 color = mix(uColor1, uColor2, fresnel);
        float pulse = 0.8 + 0.2 * sin(uTime * 2.0);
        float alpha = fresnel * uOpacity * pulse;
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      coreMesh.scale.set(2, 2, 1.5); // Escalar para que se ajuste al centro del corazón paramétrico
      heartGroup.add(coreMesh);
      gsap.to(coreMat.uniforms.uOpacity, { value: 0.8, duration: 3, delay: 1 });

      // 2. Partículas del corazón (8000 puntos)
      const heartCount = 8000;
      const heartPos = new Float32Array(heartCount * 3);
      const heartColors = new Float32Array(heartCount * 3);
      const heartRand = new Float32Array(heartCount);
      const heartSizes = new Float32Array(heartCount);

      for (let i = 0; i < heartCount; i++) {
        const t = Math.random() * Math.PI * 2;

        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        const spread = 0.85 + Math.random() * 0.3; // Un poco más denso
        heartPos[i * 3] = x * 0.5 * spread + (Math.random() - 0.5) * 1.2;
        heartPos[i * 3 + 1] = y * 0.5 * spread + (Math.random() - 0.5) * 1.2;
        heartPos[i * 3 + 2] = (Math.random() - 0.5) * 4; // Más profundidad 3D

        // Gradiente de colores (del rojo profundo al rosa brillante)
        const mixFactor = Math.random();
        heartColors[i * 3] = 0.8 + mixFactor * 0.2;
        heartColors[i * 3 + 1] = 0.1 + mixFactor * 0.4;
        heartColors[i * 3 + 2] = 0.2 + mixFactor * 0.5;
        heartRand[i] = Math.random();
        heartSizes[i] = 0.3 + Math.random() * 0.7;
      }

      const heartGeo = new THREE.BufferGeometry();
      heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
      heartGeo.setAttribute('aColor', new THREE.BufferAttribute(heartColors, 3));
      heartGeo.setAttribute('aRandom', new THREE.BufferAttribute(heartRand, 1));
      heartGeo.setAttribute('aSize', new THREE.BufferAttribute(heartSizes, 1));

      const heartMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {

          uOpacity: { value: 0 },

        vertexShader: `
      attribute float aRandom;
      attribute float aSize;
      attribute vec3 aColor;
      uniform float uTime;

      uniform float uPixelRatio;

      varying vec3 vColor;
      void main() {
        vColor = aColor;
        vec3 pos = position;
        pos.x += sin(uTime * 0.5 + aRandom * 6.28) * 0.15;
        pos.y += cos(uTime * 0.3 + aRandom * 6.28) * 0.15;
        vAlpha = 0.5 + 0.5 * aRandom;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = uSize * aSize * uPixelRatio * (100.0 / -mv.z);
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform float uOpacity;
      varying float vAlpha;
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float core = smoothstep(0.5, 0.0, d);
        float glow = smoothstep(0.5, 0.2, d);
        float a = (core * 1.0 + glow * 0.5) * uOpacity * vAlpha;
        gl_FragColor = vec4(vColor, a);
      }
    `
      });

      const heartParticles = new THREE.Points(heartGeo, heartMat);
      heartGroup.add(heartParticles);
      gsap.to(heartMat.uniforms.uOpacity, { value: 1, duration: 3, delay: 1 });

      // 3. CONVERGENCIA: Elementos orbitando el corazón
      const orbitGroup = new THREE.Group();
      heartGroup.add(orbitGroup);

      // Fotografías orbitando

      // Cartas de amor orbitando
      for (let i = 0; i < 10; i++) {

        .to(heartScale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.8, ease: 'power2.inOut' });  // Relajación

              obj.material.dispose();

    function showFinalText() {
      const overlay = document.getElementById('final-overlay');
      const container = document.getElementById('final-text');
      overlay.classList.add('active');
      container.innerHTML = ''; // Limpiar por si se llamara antes

      const lines = [
        { text: 'Gracias por existir.', style: 'normal' },
        { text: 'Gracias por llegar a mi vida.', style: 'normal' },
        { text: 'Gracias por ser mi historia favorita.', style: 'normal' },
        { text: 'Feliz cumpleaños, mi amor.', style: 'highlight' },
        { text: 'Y recuerda...', style: 'normal' },
        { text: 'Mi lugar favorito siempre será donde estés tú.', style: 'grand' }
      ];

      // --- MEJORA 1: Efecto de Escritura Cinematográfico ---
      lines.forEach((line, i) => {
        const p = document.createElement('p');
        p.className = line.style === 'highlight' ? 'line-highlight' : (line.style === 'grand' ? 'line-grand' : 'line-normal');
        p.style.opacity = '1'; // El contenedor es visible, las letras se revelan

        // Envolver cada carácter en un span para control individual
        const chars = line.text.split('').map(char => {
          const span = document.createElement('span');
          span.textContent = char === ' ' ? '\u00A0' : char; // Non-breaking space
          span.style.opacity = '0';
          span.style.filter = 'blur(8px)';
          span.style.display = 'inline-block';
          span.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
          return span;
        });

        chars.forEach(char => p.appendChild(char));
        container.appendChild(p);

        // Animación escalonada de revelado (Blur In)
        const baseDelay = i * 2.2 + 0.5; // Tiempo entre líneas
        chars.forEach((char, j) => {
          gsap.to(char, {
            opacity: 1,
            filter: 'blur(0px)',
            delay: baseDelay + j * 0.03, // Efecto máquina de escribir suave
            duration: 0.8,
            ease: 'power2.out',
            onStart: () => {
              // Sonido sutil de tinta para cada letra
              if (j % 2 === 0) audio.playChime(800 + Math.random() * 200);
            }
          });
        });
      });

      // --- MEJORA 2: Firma con Revelado Mágico y Efecto de Partículas ---
      const signatureDelay = lines.length * 2.2 + 2;

      setTimeout(() => {
        const signContainer = document.createElement('div');
        signContainer.className = 'signature-container';
        signContainer.style.opacity = '0';

        const sign = document.createElement('p');
        sign.className = 'sign';
        sign.textContent = 'Kely ❤';

        const heartSymbol = document.createElement('span');
        heartSymbol.className = 'floating-heart';
        heartSymbol.textContent = '❤';

        signContainer.appendChild(sign);
        container.appendChild(signContainer);

        // Revelado de la firma con GSAP
        gsap.to(signContainer, {
          opacity: 1,
          duration: 3,
          ease: 'power2.inOut',
          onStart: () => {
            audio.playChime(523.25); // Do
            setTimeout(() => audio.playChime(659.25), 200); // Mi
            setTimeout(() => audio.playChime(783.99), 400); // Sol
          }
        });

        // --- MEJORA 3: Coordinación Visual con la Escena 7 (Latido Final) ---
        // Aumentar la intensidad del bloom y la luz ambiental al aparecer la firma
        gsap.to(bloomPass, { strength: 2.5, duration: 4, ease: 'power2.inOut' });

        // Disparar un latido fuerte visual sincronizado
        if (typeof heartScale !== 'undefined') {
          gsap.to(heartScale, {
            x: 1.15, y: 1.15, z: 1.2, duration: 0.2, ease: 'power2.out',
            yoyo: true, repeat: 2,
            onComplete: () => {
              gsap.to(heartScale, { x: 1.0, y: 1.0, z: 1.0, duration: 1, ease: 'power2.inOut' });
            }
          });
        }
      }, signatureDelay * 1000);

      // --- MEJORA 4: Estilos CSS Inyectados para el overlay ---
      const styleId = 'final-text-styles';
      if (!document.getElementById(styleId)) {
        const style = document.createElement('style');
        style.id = styleId;
        style.textContent = `
      #final-overlay {
        background: radial-gradient(circle at center, rgba(10, 5, 15, 0.6) 0%, rgba(0, 0, 0, 0.95) 100%);
        backdrop-filter: blur(5px);
        transition: background 2s ease;
      }
      #final-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      #final-text p {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        letter-spacing: 0.08em;
        text-shadow: 0 0 20px rgba(255, 150, 180, 0.4);
      }
      .line-normal {
        font-size: clamp(1.2rem, 2.5vw, 1.6rem);
        font-weight: 300;
        color: #ffffff;
      }
      .line-highlight {
        font-size: clamp(1.5rem, 3vw, 2.2rem);
        font-weight: 600;
        color: #ffccdd;
        text-shadow: 0 0 30px rgba(255, 100, 150, 0.8);
        margin: 1rem 0;
      }
      .line-grand {
        font-size: clamp(1.4rem, 2.8vw, 2rem);
        font-weight: 400;
        font-style: italic;
        color: #ffd1dc;
        text-shadow: 0 0 25px rgba(255, 100, 180, 0.6);
        margin-top: 1rem;
      }
      .signature-container {
        margin-top: 3rem;
        position: relative;
      }
      .sign {
        font-size: clamp(2rem, 4vw, 3rem) !important;
        font-weight: 700 !important;
        color: #ff80ab !important;
        font-family: 'Cormorant Garamond', serif;
        letter-spacing: 0.15em;
        text-shadow: 0 0 40px rgba(255, 50, 100, 0.9);
        animation: pulseSign 3s infinite ease-in-out;
      }
      @keyframes pulseSign {
        0%, 100% { text-shadow: 0 0 40px rgba(255, 50, 100, 0.9); transform: scale(1); }
        50% { text-shadow: 0 0 60px rgba(255, 50, 100, 1), 0 0 100px rgba(255, 100, 180, 0.5); transform: scale(1.05); }
      }
    `;
        document.head.appendChild(style);
      }
    }
    // ═══════════════════════════════════════════
    // GESTOR DE ESCENAS
    // ═══════════════════════════════════════════
    const sceneConfigs = [
      { create: createScene1, title: 'El Nacimiento de una Estrella', subtitle: '09 / 07 / 2000', mood: 'space', autoAdvance: 14000, chime: 220 },
      { create: createScene2, title: 'El Libro del Destino', subtitle: 'HOMERO', mood: 'warm', autoAdvance: 14000, chime: 330 },
      { create: createScene3, title: 'La Memoria del Corazon', subtitle: 'Una ciudad de recuerdos', mood: 'warm', autoAdvance: 12000, chime: 440 },
      { create: createScene4, title: 'El Jardin del Tiempo', subtitle: 'Cada petalo, un recuerdo', mood: 'garden', autoAdvance: 12000, chime: 554 },
      { create: createScene5, title: 'Las Cartas de Kely', subtitle: 'Toca las cartas para abrirlas', mood: 'love', autoAdvance: 22000, chime: 659 },
      { create: createScene6, title: 'Feliz Cumpleanos', subtitle: 'HOMERO', mood: 'epic', autoAdvance: 14000, chime: 880 },
      { create: createScene7, title: 'Amor Eterno', subtitle: '', mood: 'love', autoAdvance: 0, chime: 1046 }
    ];

    let currentScene = null;
    let autoAdvanceTimer = null;
    let transitionTimeline = null;

    async function switchToScene(index) {
      if (index >= sceneConfigs.length) return;

      canAdvance = false;
      clearTimeout(autoAdvanceTimer);

      const transEl = document.getElementById('transition');
      const textEl = document.getElementById('scene-text');
      const titleEl = document.getElementById('scene-title');
      const subtitleEl = document.getElementById('scene-subtitle');
      const indicatorEl = document.getElementById('scene-indicator');
      const hintEl = document.getElementById('advance-hint');

      // ── FASE 1: CORTINILLA DE SALIDA (Cinemáticamente escalonada) ──
      if (transitionTimeline) transitionTimeline.kill();
      transitionTimeline = gsap.timeline();

      transitionTimeline.to(transEl, {
        opacity: 1,
        duration: 1.2,
        ease: 'power3.inOut',
        onStart: () => transEl.classList.add('active')
      });

      // Escalar el bloom durante la transición para un efecto de "flash blanco/negro"
      transitionTimeline.to(bloomPass, { strength: 3.0, duration: 0.6, ease: 'power2.in' }, 0);
      transitionTimeline.to(bloomPass, { strength: 1.5, duration: 0.8, ease: 'power2.out' }, 0.6);

      // Desvanecer texto anterior
      transitionTimeline.to(textEl, { opacity: 0, duration: 0.5 }, 0);

      await transitionTimeline;

      // ── FASE 2: INTERMEDIO (Pantalla negra, cambio de escena) ──
      // Destruir escena anterior y limpiar memoria
      if (currentScene) {
        currentScene.destroy();
        scene.remove(currentScene.group);
      }

      // Limpiar overlays persistentes
      document.getElementById('letter-overlay').classList.remove('active');
      document.getElementById('final-overlay').classList.remove('active');
      document.getElementById('final-text').innerHTML = '';

      // Resetear cámara a posición neutra para el fade in
      camera.position.set(0, 0, 30);
      camera.rotation.set(0, 0, 0);

      // Pequeña pausa dramática en negro
      await new Promise(r => setTimeout(r, 400));

      // ── FASE 3: CONSTRUCCIÓN DE LA NUEVA ESCENA ──
      const config = sceneConfigs[index];

      // Cambiar mood de audio (crossfade suave si el motor lo permite)
      audio.setSceneMood(config.mood);

      // Crear nueva escena
      currentScene = config.create();
      scene.add(currentScene.group);

      // Actualizar UI
      const romanNumerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
      indicatorEl.textContent = `${romanNumerals[index]} / VII`;
      titleEl.textContent = config.title;
      subtitleEl.textContent = config.subtitle;

      // ── FASE 4: CORTINILLA DE ENTRADA Y REVELADO ──
      if (transitionTimeline) transitionTimeline.kill();
      transitionTimeline = gsap.timeline();

      // Acuerdo de bloom para el revelado
      transitionTimeline.to(bloomPass, { strength: 2.5, duration: 0.5, ease: 'power2.out' }, 0);
      transitionTimeline.to(bloomPass, { strength: 1.5, duration: 1.5, ease: 'power2.inOut' }, 0.5);

      // Fade in del overlay negro
      transitionTimeline.to(transEl, {
        opacity: 0,
        duration: 1.5,
        ease: 'power2.inOut',
        onComplete: () => transEl.classList.remove('active')
      }, 0);

      // Texto de escena apareciendo con efecto cinematográfico
      const textTimeline = gsap.timeline({ delay: 1.5 });

      // Título
      titleEl.style.opacity = '0';
      titleEl.style.transform = 'translateY(20px)';
      titleEl.style.filter = 'blur(10px)';
      titleEl.style.transition = 'none';
      textEl.classList.add('visible'); // Hacer visible el contenedor

      textTimeline.to(titleEl, {
        opacity: 1, y: 0, filter: 'blur(0px)',
        duration: 1.5, ease: 'power3.out'
      }, 0);

      // Subtítulo
      subtitleEl.style.opacity = '0';
      subtitleEl.style.transform = 'translateY(15px)';
      subtitleEl.style.filter = 'blur(8px)';
      subtitleEl.style.transition = 'none';

      textTimeline.to(subtitleEl, {
        opacity: 0.8, y: 0, filter: 'blur(0px)',
        duration: 1.2, ease: 'power3.out'
      }, 0.4);

      // Chime musical al entrar (Acorde celestial basado en la escena)
      audio.playChime(config.chime);
      setTimeout(() => audio.playChime(config.chime * 1.25), 150); // Quinta
      setTimeout(() => audio.playChime(config.chime * 1.5), 300);  // Octava

      // Sostener el texto por 3.5 segundos y luego desvanecer
      textTimeline.to([titleEl, subtitleEl], {
        opacity: 0, y: -10,
        duration: 1.5,
        delay: 3,
        ease: 'power2.in',
        onComplete: () => textEl.classList.remove('visible')
      });

      await transitionTimeline;

      // Habilitar avance manual una vez revelada la escena
      canAdvance = true;

      // Hint visibility
      hintEl.style.display = index < sceneConfigs.length - 1 ? 'block' : 'none';

      // ── FASE 5: AUTO AVANCE ──
      if (config.autoAdvance > 0) {
        autoAdvanceTimer = setTimeout(() => {
          if (canAdvance && index < sceneConfigs.length - 1) {
            currentSceneIndex = index + 1;
            switchToScene(currentSceneIndex);
          }
        }, config.autoAdvance);
      }
    }
    // ═══════════════════════════════════════════
    // INICIALIZACIÓN
    // ═══════════════════════════════════════════
    function init() {
      // ── ESCENA BASE ──
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2('#000000', 0.008);

      // ── CÁMARA CINEMATOGRÁFICA ──
      camera = new THREE.PerspectiveCamera(60, W() / H(), 0.1, 1500);
      camera.position.set(0, 0, 30);

      // ── RENDERER OPTIMIZADO ──
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
        stencil: false
      });
      renderer.setSize(W(), H());
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.prepend(renderer.domElement);

      // ── POST-PROCESAMIENTO: Bloom Cinematográfico ──
      composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(W(), H()),
        1.2,
        0.6,
        0.7
      );
      composer.addPass(bloomPass);

      // ── RELOJ ──
      clock = new THREE.Clock();

      // ── EVENTOS DE INTERACCIÓN ──
      window.addEventListener('mousemove', (e) => {
        targetMouseX = (e.clientX / W() - 0.5) * 2;
        targetMouseY = (e.clientY / H() - 0.5) * 2;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          targetMouseX = (e.touches[0].clientX / W() - 0.5) * 2;
          targetMouseY = (e.touches[0].clientY / H() - 0.5) * 2;
        }
      }, { passive: true });

      // Resize handler
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          camera.aspect = W() / H();
          camera.updateProjectionMatrix();
          renderer.setSize(W(), H());
          composer.setSize(W(), H());
          bloomPass.resolution.set(W(), H());
        }, 100);
      });

      // ── NAVEGACIÓN DE ESCENAS ──
      function handleAdvance() {
        if (!canAdvance) return;
        if (document.getElementById('letter-overlay').classList.contains('active')) return;
        if (document.getElementById('final-overlay').classList.contains('active')) return;

        if (currentSceneIndex < sceneConfigs.length - 1) {
          canAdvance = false;
          currentSceneIndex++;
          switchToScene(currentSceneIndex);
        }
      }

      window.addEventListener('click', handleAdvance);
      window.addEventListener('touchend', (e) => {
        if (e.target.closest('#letter-overlay') || e.target.closest('#final-overlay') || e.target.closest('#loader')) return;
        handleAdvance();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          handleAdvance();
        }
        if (e.code === 'Escape') {
          if (document.getElementById('letter-overlay').classList.contains('active')) {
            document.getElementById('letter-overlay').classList.remove('active');
          }
        }
      });

      document.getElementById('letter-close').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('letter-overlay').classList.remove('active');
      });

      // ── LOADER CINEMATOGRÁFICO ──
      const loader = document.getElementById('loader');

      function startExperience() {
        if (audioStarted) return;
        audioStarted = true;

        gsap.to(loader, {
          opacity: 0,
          scale: 1.1,
          duration: 1.5,
          ease: 'power2.inOut',
          onComplete: () => {
            loader.classList.add('hidden');
            loader.style.pointerEvents = 'none';
          }
        });

        audio.init();

        setTimeout(() => {
          switchToScene(0);
        }, 1800);
      }

      loader.addEventListener('click', startExperience);
      loader.addEventListener('touchend', startExperience);

      // ── INICIAR LOOP ──
      animate();
    }
    // ═══════════════════════════════════════════
    // LOOP DE ANIMACIÓN
    // ═══════════════════════════════════════════

    // Inicializar la variable si no existe aún en el scope global, sin re-declararla
    if (typeof isPageVisible === 'undefined') {
      window.isPageVisible = true;
    }

    // Pausar animaciones si la pestaña no está visible (ahorro de recursos)
    document.addEventListener('visibilitychange', () => {
      isPageVisible = document.visibilityState === 'visible';
      if (isPageVisible) {
        clock.start(); // Reanudar el reloj para evitar saltos de tiempo
      } else {
        clock.stop();
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      // No renderizar si la pestaña está en segundo plano
      if (!isPageVisible) return;

      const rawDelta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Evitar saltos de tiempo enormes si la pestaña se congeló o hubo un lag
      const delta = Math.min(rawDelta, 0.1);

      // ── EASING GLOBAL DE INTERACCIÓN (Mouse/Touch) ──
      // Suavizado de cámara integrado en el loop de renderizado
      if (typeof targetMouseX !== 'undefined') {
        mouseX += (targetMouseX - mouseX) * 0.05; // Easing suave
        mouseY += (targetMouseY - mouseY) * 0.05;
      }

      // ── ACTUALIZACIÓN DE LA ESCENA ACTUAL ──
      if (currentScene) {
        // 1. Física y actualizaciones lógicas
        currentScene.updates.forEach(fn => fn(elapsed, delta));

        // 2. Actualización de cámara cinematográfica
        if (currentScene.cameraUpdate) {
          currentScene.cameraUpdate(elapsed, delta);
        }
      }

      // ── POST-PROCESAMIENTO Y RENDERIZADO ──
      try {
        composer.render(delta);
      } catch (e) {
        // Fallback de seguridad si el contexto WebGL se pierde
        console.error("Error de renderizado WebGL, reintentando...", e);
        renderer.render(scene, camera);
      }
    }
    // ═══════════════════════════════════════════
    // ARRANCAR
    // ═══════════════════════════════════════════
    init();

  </script>
