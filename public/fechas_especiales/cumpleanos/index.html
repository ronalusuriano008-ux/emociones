<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti de mi</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Cormorant Garamond', serif
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1
    }

    /* Overlay de carga */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.5s ease
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none
    }

    #loader p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: breathe 3s ease-in-out infinite
    }

    #loader .line {
      width: 60px;
      height: 1px;
      background: rgba(255, 180, 200, 0.4);
      margin-top: 20px;
      animation: expandLine 3s ease-in-out infinite
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.3
      }

      50% {
        opacity: 1
      }
    }

    @keyframes expandLine {

      0%,
      100% {
        width: 60px
      }

      50% {
        width: 120px
      }
    }

    /* Transición entre escenas */
    #transition {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease
    }

    #transition.active {
      opacity: 1
    }

    /* Overlay de texto cinematográfico */
    #cinematic-overlay {
      position: fixed;
      inset: 0;
      z-index: 800;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    /* Texto de escena */
    .scene-text {
      position: fixed;
      z-index: 850;
      color: #fff;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease
    }

    .scene-text.visible {
      opacity: 1
    }

    .scene-title {
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem
    }

    .scene-subtitle {
      font-size: clamp(0.8rem, 1.5vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      opacity: 0.6;
      font-style: italic
    }

    /* Carta overlay */
    #letter-overlay {
      position: fixed;
      inset: 0;
      z-index: 950;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column
    }

    #letter-overlay.active {
      display: flex
    }

    #letter-content {
      max-width: 500px;
      padding: 3rem;
      color: #f5e6d3;
      font-size: 1.2rem;
      line-height: 2;
      text-align: center;
      font-style: italic;
      letter-spacing: 0.05em
    }

    #letter-close {
      margin-top: 2rem;
      color: rgba(255, 180, 200, 0.6);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      pointer-events: auto;
      border: 1px solid rgba(255, 180, 200, 0.2);
      padding: 0.5rem 1.5rem;
      transition: all 0.3s
    }

    #letter-close:hover {
      color: rgba(255, 180, 200, 1);
      border-color: rgba(255, 180, 200, 0.5)
    }

    /* Texto final */
    #final-overlay {
      position: fixed;
      inset: 0;
      z-index: 950;
      background: rgba(0, 0, 0, 0);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: background 2s ease
    }

    #final-overlay.active {
      display: flex;
      background: rgba(0, 0, 0, 0.7)
    }

    #final-text {
      max-width: 600px;
      text-align: center;
      color: #fff
    }

    #final-text p {
      opacity: 0;
      font-size: clamp(1rem, 2vw, 1.4rem);
      line-height: 2.2;
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem
    }

    #final-text .sign {
      margin-top: 2rem;
      font-size: 1.6rem;
      color: #ffb4c8;
      font-weight: 600;
      letter-spacing: 0.1em
    }

    /* Indicador de avance */
    #advance-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 850;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      pointer-events: none;
      animation: breathe 3s ease-in-out infinite
    }

    /* Indicador de escena */
    #scene-indicator {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 850;
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      font-family: 'Space Mono', monospace;
      pointer-events: none
    }
  </style>
</head>

<body>

  <div id="loader">
    <p>Toca para comenzar</p>
    <div class="line"></div>
  </div>

  <div id="transition"></div>

  <div id="cinematic-overlay"></div>

  <div class="scene-text" id="scene-text">

  </div>

  <div id="letter-overlay">

  </div>

  <div id="final-overlay">
    <div id="final-text"></div>
  </div>

  <div id="advance-hint">toca para avanzar</div>
  <div id="scene-indicator">I / VII</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    // ═══════════════════════════════════════════
    // VARIABLES GLOBALES
    // ═══════════════════════════════════════════
    let scene, camera, renderer, composer, bloomPass, clock;
    let mouseX = 0, mouseY = 0;
    let targetMouseX = 0, targetMouseY = 0;
    let currentSceneIndex = 0;
    let sceneGroup = new THREE.Group();
    let sceneAnimations = [];
    let canAdvance = false;
    let audioCtx, audioStarted = false;
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    class AudioEngine {
      constructor() {
        this.music = null;
        this.started = false;
      }

      init() {
        if (this.started) return;

        this.started = true;

        this.music = new Audio('../../assets/audio/RBD_SALBVAME.mp3');
        this.music.loop = true;
        this.music.volume = 0.4;

        this.music.play().catch(err => {
          console.error('Error al reproducir audio:', err);
        });
      }
      playChime() { }
      playHeartbeat() { }
      setSceneMood(mood) {

      }
    }

    const audio = new AudioEngine();

    document.addEventListener('click', () => {
      audio.init();
    }, { once: true });

    function textToPositions(text, fontSize = 120, density = 2) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const lines = text.split('\n');

      ctx.font = `bold ${fontSize}px 'Cormorant Garamond', serif`;

      const maxWidth = Math.max(
        ...lines.map(line => ctx.measureText(line).width)
      );

      const lineHeight = fontSize * 1.25;

      canvas.width = Math.ceil(maxWidth) + 40;
      canvas.height = Math.ceil(lines.length * lineHeight) + 40;

      ctx.font = `bold ${fontSize}px 'Cormorant Garamond', serif`;
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      lines.forEach((line, i) => {
        const y =
          20 +
          lineHeight / 2 +
          i * lineHeight;

        ctx.fillText(line, canvas.width / 2, y);
      });

      const data = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      ).data;

      const positions = [];
      const step = Math.max(1, Math.round(density));

      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          if (data[(y * canvas.width + x) * 4 + 3] > 128) {
            positions.push(
              (x - canvas.width / 2) * 0.05,
              -(y - canvas.height / 2) * 0.05,
              (Math.random() - 0.5) * 0.3
            );
          }
        }
      }

      return new Float32Array(positions);
    }
    // ═══════════════════════════════════════════
    // UTILIDAD: CREAR PARTÍCULAS
    // ═══════════════════════════════════════════
    function createParticles(count, options = {}) {
      const {
        spread = 100,
        size = 0.3,
        color = '#ffffff',
        opacity = 0.8,
        positions: customPos = null
      } = options;

      const geo = new THREE.BufferGeometry();
      const pos = customPos || new Float32Array(count * 3);
      const randoms = new Float32Array(count);

      if (!customPos) {
        for (let i = 0; i < count; i++) {
          pos[i * 3] = (Math.random() - 0.5) * spread;
          pos[i * 3 + 1] = (Math.random() - 0.5) * spread;
          pos[i * 3 + 2] = (Math.random() - 0.5) * spread;
        }
      }

      for (let i = 0; i < count; i++) randoms[i] = Math.random();

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: size },
          uColor: { value: new THREE.Color(color) },
          uOpacity: { value: opacity },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
      attribute float aRandom;
      uniform float uTime;
      uniform float uSize;
      uniform float uPixelRatio;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        pos.x += sin(uTime * 0.3 + aRandom * 6.28) * 0.2;
        pos.y += cos(uTime * 0.2 + aRandom * 6.28) * 0.2;
        vAlpha = 0.5 + 0.5 * sin(uTime + aRandom * 6.28);
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = uSize * uPixelRatio * (80.0 / -mv.z);
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.1, d) * uOpacity * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `
      });

      return new THREE.Points(geo, mat);
    }

    // ═══════════════════════════════════════════
    // SHADERS COMPARTIDOS
    // ═══════════════════════════════════════════
    const nebulaVertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

    const nebulaFragmentShader = `
  uniform float uTime;
  uniform vec3 uColor1;
  uniform vec3 uColor2;
  varying vec2 vUv;

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 5; i++) {
      v += a * noise(p);
      p *= 2.0;
      a *= 0.5;
    }
    return v;
  }

  void main() {
    vec2 uv = vUv - 0.5;
    float dist = length(uv);
    float n = fbm(uv * 3.0 + uTime * 0.05);
    float n2 = fbm(uv * 2.0 - uTime * 0.03 + 5.0);
    vec3 color = mix(uColor1, uColor2, n);
    color += vec3(0.1, 0.05, 0.15) * n2;
    float alpha = smoothstep(0.5, 0.0, dist) * (0.15 + 0.1 * n);
    gl_FragColor = vec4(color, alpha);
  }
`;

    // ═══════════════════════════════════════════
    // ESCENA 1: EL NACIMIENTO DE UNA ESTRELLA
    // ═══════════════════════════════════════════
    function createScene1() {
      const group = new THREE.Group();
      const updates = [];
      let prevTime = 0;

      // ── FONDO PROFUNDO: 3 capas de estrellas con parallax ──

      // Capa 1: Estrellas muy distantes, pequeñas, frías
      const farStars = createParticles(20000, { spread: 500, size: 0.12, color: '#99aadd', opacity: 0.5 });
      farStars.name = 'farStars';
      group.add(farStars);
      updates.push((t) => { farStars.material.uniforms.uTime.value = t; });

      // Capa 2: Estrellas medianas, blancas
      const midStars = createParticles(15000, { spread: 300, size: 0.3, color: '#ffffff', opacity: 0.8 });
      midStars.name = 'midStars';
      group.add(midStars);
      updates.push((t) => { midStars.material.uniforms.uTime.value = t; });

      // Capa 3: Estrellas cercanas, cálidas, grandes
      const nearStars = createParticles(10000, { spread: 150, size: 0.6, color: '#ffeedd', opacity: 1.0 });
      nearStars.name = 'nearStars';
      group.add(nearStars);
      updates.push((t) => { nearStars.material.uniforms.uTime.value = t; });

      // Capa 4: Estrellas de color (rojas/azules ocasionales)
      const colorStars = createParticles(1500, { spread: 200, size: 0.5, color: '#ff8855', opacity: 0.7 });
      colorStars.name = 'colorStars';
      group.add(colorStars);
      updates.push((t) => { colorStars.material.uniforms.uTime.value = t; });

      const blueStars = createParticles(800, { spread: 200, size: 0.45, color: '#5588ff', opacity: 0.6 });
      blueStars.name = 'blueStars';
      group.add(blueStars);
      updates.push((t) => { blueStars.material.uniforms.uTime.value = t; });

      // ── NEBULOSAS MULTICAPA ──
      // Más capas, mejor posicionamiento, variedades de escala
      const nebulaConfigs = [
        { colors: ['#0a0018', '#5a0090'], pos: [-30, 20, -80], rot: 0.3, scale: 2.0 },
        { colors: ['#050020', '#0040a0'], pos: [35, -15, -60], rot: -0.5, scale: 1.4 },
        { colors: ['#200015', '#900050'], pos: [0, 5, -100], rot: 0.8, scale: 2.5 },
        { colors: ['#001025', '#004060'], pos: [-20, -25, -50], rot: 1.2, scale: 1.0 },
        { colors: ['#150025', '#600090'], pos: [25, 25, -70], rot: -0.2, scale: 1.3 },
        { colors: ['#080015', '#250050'], pos: [0, 10, -120], rot: 0.1, scale: 3.0 },
        { colors: ['#100008', '#500030'], pos: [-40, -5, -90], rot: 0.6, scale: 1.8 },
      ];

      nebulaConfigs.forEach((cfg) => {
        const geo = new THREE.PlaneGeometry(80 * cfg.scale, 80 * cfg.scale);
        const mat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uColor1: { value: new THREE.Color(cfg.colors[0]) },
            uColor2: { value: new THREE.Color(cfg.colors[1]) }
          },
          vertexShader: nebulaVertexShader,
          fragmentShader: nebulaFragmentShader
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
        mesh.rotation.z = cfg.rot;
        group.add(mesh);
        updates.push((t) => { mat.uniforms.uTime.value = t; });
      });

      // ── GAS INTERESTELAR ANIMADO (con warp de dominio) ──
      const gasGeo = new THREE.PlaneGeometry(160, 160);
      const gasMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uColor1: { value: new THREE.Color('#080015') },
          uColor2: { value: new THREE.Color('#1a0045') }
        },
        vertexShader: nebulaVertexShader,
        fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 6; i++) {
          v += a * noise(p);
          p *= 2.1;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = vUv - 0.5;
        float dist = length(uv);
        // Domain warping para flujo orgánico
        vec2 warp = vec2(
          fbm(uv * 2.0 + uTime * 0.015),
          fbm(uv * 2.0 + uTime * 0.015 + 5.2)
        );
        float n = fbm(uv * 3.0 + warp * 0.6 + uTime * 0.02);
        float n2 = fbm(uv * 1.5 - uTime * 0.015 + 10.0);
        vec3 color = mix(uColor1, uColor2, n);
        color += vec3(0.12, 0.04, 0.18) * n2;
        float alpha = smoothstep(0.5, 0.0, dist) * n * 0.18;
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const gasMesh = new THREE.Mesh(gasGeo, gasMat);
      gasMesh.position.z = -40;
      group.add(gasMesh);
      updates.push((t) => { gasMat.uniforms.uTime.value = t; });

      // ── ESTRELLAS FUGACES ──
      const shootingStars = [];
      for (let i = 0; i < 10; i++) {
        const trailLen = 35;
        const positions = new Float32Array(trailLen * 3);
        const alphas = new Float32Array(trailLen);
        for (let j = 0; j < trailLen; j++) {
          alphas[j] = 1.0 - j / trailLen;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
        const mat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uColor: { value: new THREE.Color('#ffffff') },
            uOpacity: { value: 0 }
          },
          vertexShader: `
        attribute float aAlpha;
        varying float vAlpha;
        void main() {
          vAlpha = aAlpha;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
          fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        varying float vAlpha;
        void main() {
          gl_FragColor = vec4(uColor, vAlpha * uOpacity);
        }
      `
        });
        const line = new THREE.Line(geo, mat);
        line.userData = {
          active: false,
          timer: Math.random() * 12,
          interval: 6 + Math.random() * 14,
          head: new THREE.Vector3(),
          vel: new THREE.Vector3(),
          trailLen
        };
        group.add(line);
        shootingStars.push(line);
      }

      function launchShootingStar(star) {
        const d = star.userData;
        d.active = true;
        star.material.uniforms.uOpacity.value = 1.0;
        const theta = Math.random() * Math.PI * 2;
        const r = 60 + Math.random() * 100;
        d.head.set(
          Math.cos(theta) * r,
          20 + Math.random() * 40,
          (Math.random() - 0.5) * 60 - 20
        );
        const speed = 1.2 + Math.random() * 2.5;
        d.vel.set(
          -Math.cos(theta) * speed * 0.8,
          -speed * 0.6 - Math.random() * 0.5,
          (Math.random() - 0.5) * speed * 0.3
        );
        const posArr = star.geometry.attributes.position.array;
        for (let j = 0; j < d.trailLen; j++) {
          posArr[j * 3] = d.head.x;
          posArr[j * 3 + 1] = d.head.y;
          posArr[j * 3 + 2] = d.head.z;
        }
        star.geometry.attributes.position.needsUpdate = true;
      }

      updates.push((t) => {
        const dt = Math.min(t - prevTime, 0.1);
        shootingStars.forEach(star => {
          const d = star.userData;
          if (!d.active) {
            d.timer += dt;
            if (d.timer > d.interval) {
              d.timer = 0;
              launchShootingStar(star);
            }
            return;
          }
          const posArr = star.geometry.attributes.position.array;
          for (let j = d.trailLen - 1; j > 0; j--) {
            posArr[j * 3] = posArr[(j - 1) * 3];
            posArr[j * 3 + 1] = posArr[(j - 1) * 3 + 1];
            posArr[j * 3 + 2] = posArr[(j - 1) * 3 + 2];
          }
          d.head.add(d.vel.clone().multiplyScalar(dt * 60));
          posArr[0] = d.head.x;
          posArr[1] = d.head.y;
          posArr[2] = d.head.z;
          star.geometry.attributes.position.needsUpdate = true;
          star.material.uniforms.uOpacity.value *= 0.993;
          if (star.material.uniforms.uOpacity.value < 0.01) {
            d.active = false;
            star.material.uniforms.uOpacity.value = 0;
          }
        });
      });

      // ── RAYOS VOLUMÉTRICOS DIAGONALES ──
      const godRaysCount = 14;
      for (let i = 0; i < godRaysCount; i++) {
        const rayGeo = new THREE.PlaneGeometry(0.4, 100);
        const rayMat = new THREE.MeshBasicMaterial({
          color: '#18103a',
          transparent: true, opacity: 0.012,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const ray = new THREE.Mesh(rayGeo, rayMat);
        const angle = (i / godRaysCount) * Math.PI * 2;
        ray.position.set(0, 0, -35);
        ray.rotation.z = angle;
        ray.userData = { baseAngle: angle, baseOp: 0.012 };
        group.add(ray);
        updates.push((t) => {
          ray.rotation.z = ray.userData.baseAngle + Math.sin(t * 0.08 + ray.userData.baseAngle) * 0.04;
          ray.material.opacity = ray.userData.baseOp * (0.4 + 0.6 * Math.sin(t * 0.25 + i * 0.7));
        });
      }

      // ── PARTÍCULAS CÓSMICAS DE POLVO (lentas, atmosféricas) ──
      const cosmicDust = createParticles(4000, { spread: 80, size: 0.15, color: '#aa88cc', opacity: 0.25 });
      cosmicDust.name = 'cosmicDust';
      group.add(cosmicDust);
      updates.push((t) => { cosmicDust.material.uniforms.uTime.value = t; });

      // ── PARTÍCULAS QUE FORMARÁN LA FECHA ──

      const dateText = 'Feliz Cumpleaños\n09 / 07 / 2000';
      const targetPositions = textToPositions(dateText, 90, 1.6);
      const particleCount = targetPositions.length / 3;

      // Posiciones iniciales: esparcidas por el campo estelar
      const startPos = new Float32Array(particleCount * 3);
      const randoms = new Float32Array(particleCount);
      const aSizeArr = new Float32Array(particleCount);
      for (let i = 0; i < particleCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI * 0.8;
        const r = 40 + Math.random() * 120;
        startPos[i * 3] = Math.cos(theta) * Math.cos(phi) * r;
        startPos[i * 3 + 1] = Math.sin(phi) * r;
        startPos[i * 3 + 2] = Math.cos(theta) * Math.sin(phi) * r - 20;
        randoms[i] = Math.random();
        aSizeArr[i] = 0.4 + Math.random() * 0.8;
      }

      const dateGeo = new THREE.BufferGeometry();
      dateGeo.setAttribute('position', new THREE.BufferAttribute(startPos.slice(), 3));
      dateGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
      dateGeo.setAttribute('aSize', new THREE.BufferAttribute(aSizeArr, 1));

      const dateMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: 0.7 },
          uColor: { value: new THREE.Color('#ffccdd') },
          uOpacity: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
          uProgress: { value: 0 },
          uPulse: { value: 0 },
          uExplode: { value: 0 }
        },
        vertexShader: `
      attribute float aRandom;
      attribute float aSize;
      uniform float uTime;
      uniform float uSize;
      uniform float uPixelRatio;
      uniform float uProgress;
      uniform float uPulse;
      uniform float uExplode;
      varying float vAlpha;
      varying float vDist;

      void main() {
        vec3 pos = position;

        // Respiración que se calma al converger
        float breathAmp = (1.0 - uProgress) * 3.0;
        pos.x += sin(uTime * 0.35 + aRandom * 6.283) * breathAmp;
        pos.y += cos(uTime * 0.25 + aRandom * 6.283) * breathAmp;
        pos.z += sin(uTime * 0.15 + aRandom * 3.14) * breathAmp * 0.5;

        // Pulso rítmico al formarse
        float pulse = 1.0 + uPulse * sin(uTime * 3.5 + aRandom * 6.28) * 0.04;
        pos *= pulse;

        // Explosión suave hacia afuera
        vec3 explodeDir = normalize(pos + vec3(0.0001));
        pos += explodeDir * uExplode * (15.0 + aRandom * 35.0);

        vAlpha = 0.15 + 0.85 * smoothstep(0.0, 0.6, uProgress);
        vDist = aRandom;

        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        float sizeMult = mix(1.0, 2.8, uPulse);
        sizeMult = mix(sizeMult, 0.2, uExplode);
        gl_PointSize = uSize * aSize * sizeMult * uPixelRatio * (80.0 / -mv.z);
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uPulse;
      uniform float uExplode;
      varying float vAlpha;
      varying float vDist;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;

        float core = smoothstep(0.5, 0.0, d);
        float glow = smoothstep(0.5, 0.15, d);

        vec3 color = uColor;
        // Brillo adicional durante pulso
        color = mix(color, vec3(1.0, 0.95, 1.0), uPulse * 0.6);
        // Tinte violeta durante explosión
        color = mix(color, vec3(0.5, 0.2, 1.0), uExplode * 0.7);

        float a = (core * 0.6 + glow * 0.4) * uOpacity * vAlpha;
        a *= (1.0 - uExplode * 0.85);

        gl_FragColor = vec4(color, a);
      }
    `
      });

      const dateParticles = new THREE.Points(dateGeo, dateMat);
      group.add(dateParticles);

      // ── SECUENCIA ANIMADA: converger → latir → explotar ──
      const progress = { value: 0 };
      const pulse = { value: 0 };
      const explode = { value: 0 };
      const dateTimeline = gsap.timeline({ delay: 4 });

      // Fase 1: Convergencia épica (5 segundos)
      dateTimeline.to(progress, {
        value: 1,
        duration: 5,
        ease: 'power3.inOut',
        onUpdate: () => {
          const posArr = dateGeo.attributes.position.array;
          for (let i = 0; i < particleCount; i++) {
            const idx = i * 3;
            // Cada partícula tiene un micro-retardo basado en su random
            const localP = Math.max(0, Math.min(1, progress.value * 1.15 - randoms[i] * 0.15));
            const ep = localP < 0.5
              ? 4 * localP * localP * localP
              : 1 - Math.pow(-2 * localP + 2, 3) / 2;
            posArr[idx] = startPos[idx] + (targetPositions[idx] - startPos[idx]) * ep;
            posArr[idx + 1] = startPos[idx + 1] + (targetPositions[idx + 1] - startPos[idx + 1]) * ep;
            posArr[idx + 2] = startPos[idx + 2] + (targetPositions[idx + 2] - startPos[idx + 2]) * ep;
          }
          dateGeo.attributes.position.needsUpdate = true;
          dateMat.uniforms.uProgress.value = progress.value;
        }
      });

      // Fase 2: Latido cósmico (pulsa y despulsa)
      dateTimeline.to(pulse, {
        value: 1, duration: 1.2, ease: 'sine.inOut',
        onUpdate: () => { dateMat.uniforms.uPulse.value = pulse.value; }
      });
      dateTimeline.to(pulse, {
        value: 0, duration: 1.2, ease: 'sine.inOut',
        onUpdate: () => { dateMat.uniforms.uPulse.value = pulse.value; }
      });
      // Segundo latido más fuerte
      dateTimeline.to(pulse, {
        value: 1, duration: 0.8, ease: 'sine.inOut',
        onUpdate: () => { dateMat.uniforms.uPulse.value = pulse.value; }
      });
      dateTimeline.to(pulse, {
        value: 0, duration: 0.8, ease: 'sine.inOut',
        onUpdate: () => { dateMat.uniforms.uPulse.value = pulse.value; }
      });

      // Fase 3: Explosión suave (las estrellas se dispersan)
      dateTimeline.to(explode, {
        value: 1,
        duration: 3,
        ease: 'power2.in',
        onUpdate: () => { dateMat.uniforms.uExplode.value = explode.value; }
      });

      // Fade in gradual
      gsap.to(dateMat.uniforms.uOpacity, { value: 1, duration: 3, delay: 3 });

      // Flash de luz en el momento del latido
      const flashLight = new THREE.PointLight('#ffffff', 0, 200);
      flashLight.position.set(0, 0, -5);
      group.add(flashLight);
      dateTimeline.to(flashLight, {
        intensity: 8, duration: 0.3, ease: 'power2.in',
        onUpdate: () => { flashLight.color.setHex(0xffccff); }
      }, '-=3.2');
      dateTimeline.to(flashLight, { intensity: 0, duration: 1.5, ease: 'power2.out' });

      // ── PORTAL DIMENSIONAL (5 capas) ──

      // Capa 1: Anillo exterior — ondas de energía
      const outerRingGeo = new THREE.TorusGeometry(11, 0.25, 32, 160);
      const outerRingMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 } },
        vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      varying vec3 vPos;
      void main() {
        float angle = atan(vPos.y, vPos.x);
        float wave1 = sin(angle * 14.0 + uTime * 5.0) * 0.5 + 0.5;
        float wave2 = sin(angle * 9.0 - uTime * 3.0) * 0.5 + 0.5;
        vec3 c1 = vec3(0.25, 0.0, 0.65);
        vec3 c2 = vec3(0.0, 0.45, 1.0);
        vec3 c3 = vec3(0.9, 0.15, 0.55);
        vec3 color = mix(c1, c2, wave1);
        color = mix(color, c3, wave2 * 0.35);
        float alpha = uOpacity * (0.35 + 0.65 * wave1);
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
      outerRing.position.z = -30;
      group.add(outerRing);

      // Capa 2: Anillo medio — espiral
      const midRingGeo = new THREE.TorusGeometry(9, 0.5, 32, 120);
      const midRingMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 } },
        vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      varying vec3 vPos;
      void main() {
        float angle = atan(vPos.y, vPos.x);
        float dist = length(vPos.xy);
        float swirl = sin(angle * 10.0 + uTime * 3.5 + dist * 0.4) * 0.5 + 0.5;
        vec3 c1 = vec3(0.35, 0.0, 0.8);
        vec3 c2 = vec3(0.0, 0.55, 1.0);
        vec3 c3 = vec3(1.0, 0.25, 0.55);
        vec3 color = mix(c1, c2, swirl);
        color = mix(color, c3, sin(uTime * 1.3 + angle * 2.0) * 0.25 + 0.25);
        float alpha = uOpacity * (0.45 + 0.55 * swirl);
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const midRing = new THREE.Mesh(midRingGeo, midRingMat);
      midRing.position.z = -30;
      group.add(midRing);

      // Capa 3: Disco interior — vórtice profundo con noise
      const discGeo = new THREE.CircleGeometry(8.5, 80);
      const discMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 } },
        vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      varying vec2 vUv;

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                   mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
      }

      void main() {
        vec2 uv = vUv - 0.5;
        float dist = length(uv);
        float angle = atan(uv.y, uv.x);

        // Vórtice multicapa
        float s1 = sin(angle * 7.0 - uTime * 5.0 + dist * 18.0) * 0.5 + 0.5;
        float s2 = cos(angle * 5.0 + uTime * 3.0 - dist * 12.0) * 0.5 + 0.5;
        float s3 = sin(angle * 12.0 - uTime * 7.0 + dist * 25.0) * 0.5 + 0.5;
        float n = noise(uv * 6.0 + uTime * 0.4);

        vec3 color = mix(vec3(0.12, 0.0, 0.35), vec3(0.0, 0.35, 0.85), s1);
        color = mix(color, vec3(0.75, 0.08, 0.45), s2 * 0.4);
        color = mix(color, vec3(1.0, 0.85, 1.0), s3 * 0.12);
        color += vec3(0.08) * n;

        // Centro brillante
        float center = smoothstep(0.35, 0.0, dist);
        color += vec3(0.35, 0.25, 0.55) * center;

        float alpha = uOpacity * smoothstep(0.5, 0.0, dist) * (0.15 + 0.85 * s1);
        alpha = max(alpha, center * uOpacity * 0.6);

        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.position.z = -30;
      group.add(disc);

      // Capa 4: Lens flare central (destello con spikes)
      const flareGeo = new THREE.PlaneGeometry(6, 6);
      const flareMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 } },
        vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
        fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      varying vec2 vUv;
      void main() {
        vec2 uv = vUv - 0.5;
        float dist = length(uv);
        float glow = exp(-dist * 5.0);
        vec3 color = vec3(0.85, 0.75, 1.0) * glow;
        // Spikes cruciformes
        float spikeH = exp(-abs(uv.x) * 40.0) * exp(-abs(uv.y) * 4.0);
        float spikeV = exp(-abs(uv.y) * 40.0) * exp(-abs(uv.x) * 4.0);
        float spikeD1 = exp(-abs(uv.x - uv.y) * 25.0) * exp(-abs(uv.x + uv.y) * 4.0);
        float spikeD2 = exp(-abs(uv.x + uv.y) * 25.0) * exp(-abs(uv.x - uv.y) * 4.0);
        float spikes = (spikeH + spikeV) * 0.6 + (spikeD1 + spikeD2) * 0.3;
        color += vec3(0.55, 0.45, 0.85) * spikes * 0.4;
        // Pulso sutil
        float pulse = 0.85 + 0.15 * sin(uTime * 2.0);
        float alpha = (glow + spikes * 0.25) * uOpacity * pulse;
        gl_FragColor = vec4(color, alpha);
      }
    `
      });
      const flare = new THREE.Mesh(flareGeo, flareMat);
      flare.position.z = -29;
      group.add(flare);

      // Capa 5: Tendrils de energía (partículas espirales)
      const tendrilCount = 4000;
      const tendrilPos = new Float32Array(tendrilCount * 3);
      const tendrilRand = new Float32Array(tendrilCount);
      for (let i = 0; i < tendrilCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = 2 + Math.random() * 18;
        tendrilPos[i * 3] = Math.cos(angle) * r;
        tendrilPos[i * 3 + 1] = Math.sin(angle) * r;
        tendrilPos[i * 3 + 2] = -30 + (Math.random() - 0.5) * 6;
        tendrilRand[i] = Math.random();
      }
      const tendrilGeo = new THREE.BufferGeometry();
      tendrilGeo.setAttribute('position', new THREE.BufferAttribute(tendrilPos, 3));
      tendrilGeo.setAttribute('aRandom', new THREE.BufferAttribute(tendrilRand, 1));
      const tendrilMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: 0.18 },
          uColor: { value: new THREE.Color('#7050ff') },
          uOpacity: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
      attribute float aRandom;
      uniform float uTime;
      uniform float uSize;
      uniform float uPixelRatio;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        float angle = atan(pos.y, pos.x);
        float r = length(pos.xy);
        // Espiral hacia el centro
        float newR = r - sin(uTime * 0.4 + aRandom * 6.28) * 0.8;
        newR = max(newR, 0.3);
        float spinSpeed = 0.4 + aRandom * 0.4;
        pos.x = cos(angle + uTime * spinSpeed) * newR;
        pos.y = sin(angle + uTime * spinSpeed) * newR;
        pos.z += sin(uTime * 0.8 + aRandom * 6.28) * 0.4;
        vAlpha = 0.2 + 0.8 * aRandom;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = uSize * uPixelRatio * (50.0 / -mv.z);
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * uOpacity * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `
      });
      const tendrils = new THREE.Points(tendrilGeo, tendrilMat);
      group.add(tendrils);
      updates.push((t) => { tendrilMat.uniforms.uTime.value = t; });

      // Capa 6: Anillo de partículas orbitando el portal
      const orbitCount = 2000;
      const orbitPos = new Float32Array(orbitCount * 3);
      const orbitRand = new Float32Array(orbitCount);
      for (let i = 0; i < orbitCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = 9 + Math.random() * 3;
        orbitPos[i * 3] = Math.cos(angle) * r;
        orbitPos[i * 3 + 1] = Math.sin(angle) * r;
        orbitPos[i * 3 + 2] = -30 + (Math.random() - 0.5) * 2;
        orbitRand[i] = Math.random();
      }
      const orbitGeo = new THREE.BufferGeometry();
      orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPos, 3));
      orbitGeo.setAttribute('aRandom', new THREE.BufferAttribute(orbitRand, 1));
      const orbitMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: 0.25 },
          uColor: { value: new THREE.Color('#cc80ff') },
          uOpacity: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
      attribute float aRandom;
      uniform float uTime;
      uniform float uSize;
      uniform float uPixelRatio;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        float angle = atan(pos.y, pos.x) + uTime * (0.8 + aRandom * 0.3);
        float r = length(pos.xy);
        pos.x = cos(angle) * r;
        pos.y = sin(angle) * r;
        vAlpha = 0.4 + 0.6 * sin(uTime * 2.0 + aRandom * 6.28);
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = uSize * uPixelRatio * (60.0 / -mv.z);
        gl_PointSize = max(gl_PointSize, 1.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
        fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * uOpacity * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `
      });
      const orbitParticles = new THREE.Points(orbitGeo, orbitMat);
      group.add(orbitParticles);
      updates.push((t) => { orbitMat.uniforms.uTime.value = t; });

      // ── ANIMACIÓN DE APARICIÓN DEL PORTAL ──
      dateTimeline.to([outerRingMat.uniforms.uOpacity, midRingMat.uniforms.uOpacity], {
        value: 1, duration: 2, ease: 'power2.inOut'
      }, '-=2');
      dateTimeline.to(discMat.uniforms.uOpacity, {
        value: 1, duration: 2.5, ease: 'power2.inOut'
      }, '-=1.5');
      dateTimeline.to(flareMat.uniforms.uOpacity, {
        value: 1, duration: 1.5, ease: 'power2.inOut'
      }, '-=1.5');
      dateTimeline.to(tendrilMat.uniforms.uOpacity, {
        value: 0.7, duration: 2, ease: 'power2.inOut'
      }, '-=2');
      dateTimeline.to(orbitMat.uniforms.uOpacity, {
        value: 0.8, duration: 2, ease: 'power2.inOut'
      }, '-=1.5');

      updates.push((t) => {
        outerRingMat.uniforms.uTime.value = t;
        midRingMat.uniforms.uTime.value = t;
        discMat.uniforms.uTime.value = t;
        flareMat.uniforms.uTime.value = t;
        dateMat.uniforms.uTime.value = t;
        outerRing.rotation.z = t * 0.12;
        midRing.rotation.z = -t * 0.18;
        prevTime = t;
      });

      // ── CÁMARA CINEMATOGRÁFICA: dolly + crane ──
      const camAnim = {
        x: 0, y: 2, z: 40,
        lookX: 0, lookY: 0, lookZ: -30
      };

      // Dolly forward lento
      gsap.to(camAnim, { z: 12, duration: 18, ease: 'none' });
      // Crane down suave
      gsap.to(camAnim, { y: 0, duration: 18, ease: 'power1.inOut' });
      // Look target se mueve al portal
      gsap.to(camAnim, { lookZ: -30, duration: 18, ease: 'none' });

      return {
        group, updates,
        cameraUpdate: () => {
          camera.position.x = camAnim.x + mouseX * 4;
          camera.position.y = camAnim.y + mouseY * 3;
          camera.position.z = camAnim.z;
          camera.lookAt(camAnim.lookX, camAnim.lookY, camAnim.lookZ);
        },
        destroy: () => {
          dateTimeline.kill();
          group.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
      };
    }

    // ═══════════════════════════════════════════
    // ESCENA 2: EL LIBRO DEL DESTINO
    // ═══════════════════════════════════════════
    function createScene2() {
      const group = new THREE.Group();
      const updates = [];

      // ── ARQUITECTURA INFINITA (Interstellar / Inception) ──

        color: '#050204', roughness: 0.2, metalness: 0.9
      });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
      floor.rotation.x = -Math.PI / 2;

      // Pilares colosales
      const pillarGeo = new THREE.CylinderGeometry(0.8, 1.2, 40, 8);
      const pillarMat = new THREE.MeshStandardMaterial({ color: '#0a0506', roughness: 0.6, metalness: 0.5 });
      const pillarPositions = [];
      for (let i = 0; i < 16; i++) {

        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(Math.cos(angle) * r, 12, Math.sin(angle) * r);
        group.add(pillar);
        pillarPositions.push(pillar.position);
      }

      // Arcos entre pilares
      const archMat = new THREE.MeshStandardMaterial({ color: '#150a0c', roughness: 0.5, metalness: 0.6 });
      for (let i = 0; i < 16; i++) {
        const angle1 = (i / 16) * Math.PI * 2;
        const angle2 = ((i + 1) / 16) * Math.PI * 2;
        const r = 25;
        const midAngle = (angle1 + angle2) / 2;

        const arch = new THREE.Mesh(
          new THREE.TorusGeometry(r * Math.sin(Math.PI / 16) * 2.05, 0.4, 8, 12, Math.PI),
          archMat
        );
        arch.position.set(Math.cos(midAngle) * r, 30, Math.sin(midAngle) * r);
        arch.rotation.y = -midAngle + Math.PI / 2;
        arch.rotation.x = Math.PI;
        group.add(arch);
      }

      // Escaleras imposibles (Penrose / Inception)
      const stairMat = new THREE.MeshStandardMaterial({ color: '#120808', roughness: 0.7, metalness: 0.4 });
      const stairGroup = new THREE.Group();
      for (let loop = 0; loop < 4; loop++) {
        const stairLoop = new THREE.Group();
        const stepsPerSide = 8;
        for (let side = 0; side < 4; side++) {
          for (let step = 0; step < stepsPerSide; step++) {
            const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 1), stairMat);
            const progress = step / stepsPerSide;
            stepMesh.position.set(
              (side === 0 ? progress * 8 : side === 2 ? -progress * 8 : side === 1 ? 8 : -8) + (side < 2 ? 0 : 0),
              loop * 10 + step * 0.5 + side * stepsPerSide * 0.5,
              (side === 1 ? progress * 8 : side === 3 ? -progress * 8 : side === 0 ? 8 : -8)
            );
            stepMesh.rotation.y = side * Math.PI / 2;
            stairLoop.add(stepMesh);
          }
        }
        stairLoop.position.y = loop * 10;
        stairLoop.rotation.y = loop * 0.4;

      stairGroup.position.set(15, -5, -15);
      group.add(stairGroup);

      // ── VITRALES GIGANTES ──
      function createStainedGlassTexture(hue) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#050208';
        ctx.fillRect(0, 0, 512, 1024);

        // Patrón de vitral romántico
        const colors = [`hsl(${hue}, 80%, 40%)`, `hsl(${hue + 30}, 70%, 50%)`, `hsl(${hue + 60}, 90%, 30%)`];
        for (let i = 0; i < 25; i++) {
          ctx.beginPath();
          ctx.arc(
            Math.random() * 512, Math.random() * 1024,
            30 + Math.random() * 80, 0, Math.PI * 2
          );
          ctx.fillStyle = colors[i % 3];
          ctx.globalAlpha = 0.6;
          ctx.fill();
          ctx.strokeStyle = '#0a0510';
          ctx.globalAlpha = 1;
          ctx.lineWidth = 4;
          ctx.stroke();
        }
        // Líneas de estructura
        for (let y = 0; y < 1024; y += 80) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y);
          ctx.strokeStyle = '#0a0510'; ctx.lineWidth = 6; ctx.stroke();
        }
        for (let x = 0; x < 512; x += 80) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024);
          ctx.strokeStyle = '#0a0510'; ctx.lineWidth = 6; ctx.stroke();
        }
        // Brillo central
        const grad = ctx.createRadialGradient(256, 512, 0, 256, 512, 300);
        grad.addColorStop(0, 'rgba(255, 220, 150, 0.4)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 1024);

        const tex = new THREE.CanvasTexture(c);
        return tex;
      }

      const windowPositions = [
        { pos: [25, 15, -5], rot: [0, -Math.PI / 2, 0], hue: 330 },
        { pos: [-25, 15, -5], rot: [0, Math.PI / 2, 0], hue: 270 },
        { pos: [0, 15, -25], rot: [0, Math.PI, 0], hue: 30 }
      ];

      windowPositions.forEach(wp => {
        const glassTex = createStainedGlassTexture(wp.hue);
        const glassMat = new THREE.MeshBasicMaterial({
          map: glassTex, transparent: true, opacity: 0.8,

        });
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(12, 24), glassMat);
        glass.position.set(...wp.pos);

        // Marco del vitral
        const frameMat = new THREE.MeshStandardMaterial({ color: '#0a0508', roughness: 0.4, metalness: 0.8 });
        const frame = new THREE.Mesh(new THREE.BoxGeometry(12.5, 24.5, 0.5), frameMat);
        frame.position.set(...wp.pos);
        frame.rotation.set(...wp.rot);
        group.add(frame);
      });

      // ── RAYOS VOLUMÉTRICOS DINÁMICOS ──
      const godRaysGroup = new THREE.Group();
      for (let i = 0; i < 18; i++) {
        const rayGeo = new THREE.PlaneGeometry(1.5, 35);
        const rayMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color('#ffcc66') },
            uBaseOpacity: { value: 0.015 + Math.random() * 0.02 }
          },
          vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
          fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uBaseOpacity;
        varying vec2 vUv;
        
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        
        void main() {
          vec2 uv = vUv;
          // Fade desde la parte superior
          float fade = smoothstep(0.0, 0.4, uv.y) * smoothstep(1.0, 0.6, uv.y);
          // Movimiento de polvo
          float dust = hash(uv * 10.0 + uTime * 0.2) * 0.5;
          float flicker = 0.8 + 0.2 * sin(uTime * 0.5 + uv.y * 3.0);
          float alpha = fade * uBaseOpacity * (0.7 + dust) * flicker;
          gl_FragColor = vec4(uColor, alpha);
        }
      `
        });
        const ray = new THREE.Mesh(rayGeo, rayMat);
        ray.position.set(
          (Math.random() - 0.5) * 20,
          15,
          (Math.random() - 0.5) * 10 - 5
        );
        ray.rotation.x = -0.2 + Math.random() * 0.1;
        ray.rotation.z = (Math.random() - 0.5) * 0.3;
        godRaysGroup.add(ray);
        updates.push((t) => { rayMat.uniforms.uTime.value = t; });
      }
      group.add(godRaysGroup);

      // ── LIBROS FLOTANTES MEJORADOS ──
      const bookColors = ['#8B4513', '#654321', '#4a2c0a', '#6b3a2a', '#5c3317', '#7a2e35', '#2e1a47'];
      for (let i = 0; i < 60; i++) {
        const bookGroup = new THREE.Group();
        const bw = 1 + Math.random() * 1.8;
        const bh = 1.5 + Math.random() * 1.2;
        const bd = 0.2 + Math.random() * 0.4;

        // Cubierta
        const bookCover = new THREE.Mesh(
          new THREE.BoxGeometry(bw, bh, bd),

            color: bookColors[i % bookColors.length],

        bookGroup.add(bookCover);

        // Páginas (lomo blanco/crema)
        const pagesMesh = new THREE.Mesh(
          new THREE.BoxGeometry(bw * 0.9, bh * 0.9, bd * 0.7),
          new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.9 })
        );
        pagesMesh.position.z = bd * 0.2;
        bookGroup.add(pagesMesh);

        // Brillo mágico para algunos
        if (Math.random() > 0.7) {
          const glowLight = new THREE.PointLight('#ffaa44', 0.3, 5);
          glowLight.position.set(0, 0, 1);
          bookGroup.add(glowLight);
        }

        bookGroup.position.set(
          (Math.random() - 0.5) * 50,
          (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 40 - 10
        );
        bookGroup.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

        bookGroup.userData = {
          origY: bookGroup.position.y,
          speed: 0.2 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.008,
          floatAmp: 0.3 + Math.random() * 0.7
        };

        group.add(bookGroup);
        updates.push((t) => {
          bookGroup.position.y = bookGroup.userData.origY + Math.sin(t * bookGroup.userData.speed + bookGroup.userData.phase) * bookGroup.userData.floatAmp;
          bookGroup.rotation.y += bookGroup.userData.rotSpeed;
        });
      }

      // ── CARTAS FLOTANTES ──
      const letterParticles = createParticles(3000, { spread: 50, size: 0.08, color: '#ffd1dc', opacity: 0.5 });
      group.add(letterParticles);
      updates.push((t) => { letterParticles.material.uniforms.uTime.value = t; });

      // ── LIBRO GIGANTE CENTRAL (Rig cinematográfico) ──
      const bookRig = new THREE.Group();
      bookRig.position.set(0, 0, -5);

      // Canvas de la cubierta con "HOMERO"
      const coverCanvas = document.createElement('canvas');
      coverCanvas.width = 1024; coverCanvas.height = 512;
      const cCtx = coverCanvas.getContext('2d');

      // Fondo de cuero envejecido
      const leatherGrad = cCtx.createRadialGradient(512, 256, 0, 512, 256, 512);
      leatherGrad.addColorStop(0, '#3a1a08');
      leatherGrad.addColorStop(1, '#1a0a02');
      cCtx.fillStyle = leatherGrad;
      cCtx.fillRect(0, 0, 1024, 512);

      // Bordes ornamentales dorados
      cCtx.strokeStyle = '#c9a84c';
      cCtx.lineWidth = 6;
      cCtx.strokeRect(30, 30, 964, 452);
      cCtx.strokeRect(50, 50, 924, 412);
      cCtx.strokeRect(70, 70, 884, 372);

      // Esquinas decorativas
      const cornerSize = 40;
      [[70, 70], [954 - cornerSize, 70], [70, 442 - cornerSize], [954 - cornerSize, 442 - cornerSize]].forEach(([x, y]) => {
        cCtx.beginPath();
        cCtx.moveTo(x, y + cornerSize);
        cCtx.lineTo(x, y);
        cCtx.lineTo(x + cornerSize, y);
        cCtx.strokeStyle = '#dbb860';
        cCtx.lineWidth = 4;
        cCtx.stroke();
      });

      // Halo suave detrás del texto
      const halo = cCtx.createRadialGradient(
        512, 200, 0,
        512, 200, 280
      );

      halo.addColorStop(0, 'rgba(255,220,120,0.35)');
      halo.addColorStop(0.5, 'rgba(255,220,120,0.12)');
      halo.addColorStop(1, 'rgba(255,220,120,0)');

      cCtx.fillStyle = halo;
      cCtx.fillRect(150, 0, 724, 400);

      // Texto principal
      cCtx.font = 'bold 120px Cormorant Garamond, serif';
      cCtx.textAlign = 'center';
      cCtx.textBaseline = 'middle';

      cCtx.shadowColor = '#ffe8a0';
      cCtx.shadowBlur = 60;
      cCtx.fillStyle = '#e3c97a';

      const lines = ['RONNY', '09-07-2000'];
      const lineHeight = 100;

      const startY = 200 - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, i) => {
        const y = startY + i * lineHeight;

        // Glow extra
        for (let g = 0; g < 3; g++) {
          cCtx.fillText(line, 512, y);
        }
      });

      // Frase inferior
      cCtx.shadowBlur = 20;
      cCtx.font = 'italic 26px Great Vibes, cursive';
      cCtx.fillStyle = '#fffdf8';
      cCtx.fillText(
        'Que todos tus sueños brillen hoy',
        512,
        380
      );

      cCtx.shadowBlur = 0;

      // Símbolo decorativo
      cCtx.font = '60px serif';
      cCtx.fillStyle = '#c94a4a';
      cCtx.fillText('❧', 512, 320);

      const coverTexture = new THREE.CanvasTexture(coverCanvas);

      // Cubierta frontal (con pivot en el borde izquierdo para abrir)
      const coverPivot = new THREE.Group();
      coverPivot.position.x = -4; // Borde izquierdo
      const coverMesh = new THREE.Mesh(
        new THREE.BoxGeometry(8, 6, 0.3),
        new THREE.MeshStandardMaterial({
          map: coverTexture,
          emissiveMap: coverTexture,
          emissive: '#fff4c4',
          emissiveIntensity: 0.45,
          roughness: 0.35,
          metalness: 0.6
        })
      );
      coverMesh.position.x = 4; // Offset para que el pivot esté a la izquierda
      coverPivot.add(coverMesh);
      bookRig.add(coverPivot);

      // Páginas del libro
      const pagesMesh = new THREE.Mesh(
        new THREE.BoxGeometry(7.5, 5.5, 1.2),
        new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.95 })
      );
      bookRig.add(pagesMesh);

      // Contraportada
      const backCover = new THREE.Mesh(
        new THREE.BoxGeometry(8, 6, 0.3),
        new THREE.MeshStandardMaterial({ color: '#1a0a02', roughness: 0.6, metalness: 0.3 })
      );
      backCover.position.z = -0.6;
      bookRig.add(backCover);

      // Lomo del libro
      const spine = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 6, 1.5),
        new THREE.MeshStandardMaterial({ color: '#2a1508', roughness: 0.5, metalness: 0.4 })
      );
      spine.position.x = -4;
      bookRig.add(spine);

      group.add(bookRig);

      // ── ANIMACIÓN DE APERTURA CINEMATOGRÁFICA ──
      const openTimeline = gsap.timeline({ delay: 2 });

      // Luz que se enciende al abrir
      const bookLight = new THREE.PointLight('#ffd87a', 0, 35);
      bookLight.position.set(0, 2, 2);
      bookRig.add(bookLight);

      // Libro levantándose primero
      openTimeline.to(bookRig.rotation, { x: -0.4, duration: 1.5, ease: 'power2.inOut' }, 0);
      openTimeline.to(bookRig.position, { y: 1, duration: 1.5, ease: 'power2.inOut' }, 0);

      // Apertura de la cubierta
      openTimeline.to(coverPivot.rotation, { y: -Math.PI * 0.85, duration: 2.5, ease: 'power3.inOut' }, 1);

      // Luz dorada que emana del interior
      openTimeline.to(bookLight, {
        intensity: 8,
        duration: 2,
        ease: 'power2.in'
      }, 1.5);

      // Partículas doradas emergiendo del libro
      const bookParticles = createParticles(2000, { spread: 3, size: 0.2, color: '#ffd700', opacity: 0.8 });
      bookParticles.position.set(0, 1, 0);
      bookRig.add(bookParticles);
      updates.push((t) => { bookParticles.material.uniforms.uTime.value = t; });

      openTimeline.to(bookParticles.material.uniforms.uOpacity, { value: 0.5, duration: 2, ease: 'power2.in' }, 2);
      openTimeline.to(bookParticles.scale, { x: 6, y: 8, z: 6, duration: 3, ease: 'power2.out' }, 2);

      // ── FOTOGRAFÍAS HOLOGRÁFICAS ──
      const photoSeeds = ['love', 'couple', 'sunset', 'romantic', 'heart', 'flower', 'ocean', 'stars', 'embrace', 'destiny'];
      const photos = [];

      const hologramVertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

      const hologramFragmentShader = `
    uniform sampler2D uMap;
    uniform float uTime;
    uniform float uOpacity;
    varying vec2 vUv;
    
    void main() {
      vec2 uv = vUv;
      // Scanlines
      float scanline = sin(uv.y * 200.0 + uTime * 2.0) * 0.04;
      // Chromatic aberration
      float aberr = 0.003 + sin(uTime) * 0.001;
      float r = texture2D(uMap, uv + vec2(aberr, 0.0)).r;
      float g = texture2D(uMap, uv).g;
      float b = texture2D(uMap, uv - vec2(aberr, 0.0)).b;
      vec3 color = vec3(r, g, b);
      // Brillo holográfico
      color += vec3(0.1, 0.2, 0.3) * scanline;
      // Flicker
      float flicker = 0.95 + 0.05 * sin(uTime * 10.0);
      // Borde brillante
      float border = smoothstep(0.0, 0.05, uv.x) * smoothstep(1.0, 0.95, uv.x) *
                     smoothstep(0.0, 0.05, uv.y) * smoothstep(1.0, 0.95, uv.y);
      color += vec3(0.3, 0.5, 0.8) * (1.0 - border) * 0.5;
      
      float alpha = uOpacity * flicker * border;
      gl_FragColor = vec4(color, alpha);
    }
  `;

      photoSeeds.forEach((seed, i) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = `https://picsum.photos/seed/${seed}kely${i}/256/256.jpg`;
        const tex = new THREE.Texture(img);
        img.onload = () => { tex.needsUpdate = true; };

        const photoMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
          uniforms: {
            uMap: { value: tex },
            uTime: { value: 0 },
            uOpacity: { value: 0 }
          },
          vertexShader: hologramVertexShader,
          fragmentShader: hologramFragmentShader
        });

        const frame = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), photoMat);

        const angle = (i / photoSeeds.length) * Math.PI * 2;
        const radius = 7 + Math.random() * 4;
        const height = (Math.random() - 0.5) * 8;

        frame.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius - 5
        );

        frame.userData = {
          angle, radius, height,
          speed: 0.08 + Math.random() * 0.08,
          ySpeed: 0.3 + Math.random() * 0.2,
          phase: Math.random() * Math.PI * 2
        };

        group.add(frame);
        photos.push(frame);

        // Aparición escalonada
        openTimeline.to(photoMat.uniforms.uOpacity, {
          value: 0.85, duration: 1.5, ease: 'power2.inOut'
        }, 3 + i * 0.3);
      });

      updates.push((t) => {
        photos.forEach(p => {
          const d = p.userData;
          const a = d.angle + t * d.speed;
          p.position.x = Math.cos(a) * d.radius;
          p.position.z = Math.sin(a) * d.radius - 5;
          p.position.y = d.height + Math.sin(t * d.ySpeed + d.phase) * 1.5;
          p.lookAt(camera.position);
          p.material.uniforms.uTime.value = t;
        });
      });

      // ── CÁMARA CINEMATOGRÁFICA ──
      const camBase = { x: 0, y: 2, z: 14 };
      gsap.to(camBase, { y: 5, duration: 8, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to(camBase, { z: 10, duration: 12, ease: 'none' });

      return {
        group, updates,
        cameraUpdate: () => {
          camera.position.set(
            camBase.x + mouseX * 4,
            camBase.y + mouseY * 3,
            camBase.z
          );
          camera.lookAt(0, 1, -5);
        },
        destroy: () => {
          openTimeline.kill();
          scene.fog = new THREE.FogExp2('#000000', 0.008); // Reset fog
          group.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
      };
    }

    // ═══════════════════════════════════════════
    // ESCENA 3: LA MEMORIA DEL CORAZÓN
    // ═══════════════════════════════════════════
    function createScene3() {

      const interactivePhotos = [];
      const activeMemories = [];

      scene.fog = new THREE.FogExp2('#180812', 0.018);

      sunsetLight.position.set(-30, 20, 10);

      const rimLight = new THREE.DirectionalLight('#8020aa', 0.8);

      centerGlow.position.set(0, 8, 0);
