<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Karaoke</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }

        canvas {

            display: block;

            width: 100%;
            height: 100%;

        }

#lyrics {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 85%;
    max-width: 1200px;

    text-align: center;

    font-size: clamp(
        2rem,
        3vw,
        4rem
    );

    font-family:
        Georgia,
        serif;

    color: white;

    text-shadow:
        0 0 10px #ffffff,
        0 0 20px #80ffff,
        0 0 40px #80ffff,
        0 0 80px #40c0ff;

    opacity: 0;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;

    pointer-events: none;

    z-index: 1000;
}

    </style>

</head>

<body>

    <!-- Título opcional -->

    <!-- Letra sincronizada -->
    <div id="lyrics"></div>

    <!-- Three.js -->
    <script
        type="module"
        src="./main.js">
    </script>

</body>

</html>
